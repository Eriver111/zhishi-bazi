<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>04 · 地域影响</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0c0a;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}
/* 八字卡片 */
.bazi-card{position:absolute;top:260px;left:50%;transform:translateX(-50%);background:rgba(24,22,18,.9);border:1px solid rgba(201,168,76,.15);border-radius:16px;padding:28px 36px;text-align:center}
.bazi-card .chars{font-size:44px;color:#e8cf70;letter-spacing:8px;font-weight:900}
.bazi-card .label{font-size:18px;color:#a09888;letter-spacing:3px;margin-top:8px}
/* 地图简图 */
.map{position:absolute;top:600px;left:50%;transform:translateX(-50%)}
.map svg{width:600px;height:700px}
/* 闪光效果 */
.flash{position:absolute;border-radius:50%;opacity:0;transition:all 1s}
.flash.fire{width:180px;height:180px;background:radial-gradient(circle,rgba(255,152,0,.4),rgba(255,87,34,.2),transparent);box-shadow:0 0 60px rgba(255,152,0,.3)}
.flash.water{width:180px;height:180px;background:radial-gradient(circle,rgba(33,150,243,.35),rgba(3,169,244,.15),transparent);box-shadow:0 0 60px rgba(33,150,243,.25)}
#fireFlash{top:520px;left:420px;opacity:0;animation:pulse 1.5s ease-in-out infinite}
#waterFlash{top:700px;left:420px;opacity:0;animation:pulse 1.5s ease-in-out infinite .75s}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.3);opacity:.9}}
/* 结果标签 */
.result-tag{position:absolute;text-align:center;opacity:0;transition:opacity .8s}
#resultGood{top:1450px;left:220px}
#resultBad{top:1450px;left:640px}
.result-tag .icon{font-size:50px;display:block;margin-bottom:8px}
.result-tag .title{font-size:24px;color:#e8cf70;font-weight:700;letter-spacing:4px}
.result-tag .desc{font-size:18px;color:#d8d0c0;letter-spacing:2px;margin-top:6px;line-height:1.8}
.result-tag .desc .dim{color:#a09888}
.result-tag.show{opacity:1}
/* 对比线 */
.vs-line{position:absolute;top:1450px;left:50%;width:2px;height:120px;background:linear-gradient(180deg,transparent,rgba(201,168,76,.3),transparent);transform:translateX(-50%);opacity:0;transition:opacity .6s}
.vs-line.show{opacity:1}
</style>
</head>
<body>
<div class="stage">
  <div class="bazi-card">
    <div class="chars">乙 丑 日 · 金神</div>
    <div class="label">同八字 · 不同出生地</div>
  </div>

  <!-- 中国简图 -->
  <div class="map">
    <svg viewBox="0 0 600 700">
      <!-- 简化中国地图轮廓 -->
      <path d="M280,30 L340,30 L370,50 L390,40 L420,55 L440,70 L460,90 L470,110 L460,130 L450,160 L440,180 L460,200 L470,230 L480,250 L470,280 L460,310 L440,340 L430,370 L410,390 L390,410 L370,430 L350,450 L330,470 L310,490 L290,510 L260,530 L240,550 L220,560 L200,570 L180,560 L160,540 L150,510 L140,480 L130,450 L120,420 L110,390 L100,360 L90,330 L85,300 L80,270 L80,240 L90,210 L100,180 L110,150 L130,120 L150,100 L180,80 L210,60 L240,45 Z"
        fill="rgba(24,22,18,.6)" stroke="rgba(201,168,76,.2)" stroke-width="2"/>
      <!-- 南方标记 -->
      <circle cx="350" cy="440" r="60" fill="rgba(255,152,0,.08)" stroke="rgba(255,152,0,.3)" stroke-width="2">
        <animate attributeName="r" values="60;70;60" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="350" y="435" text-anchor="middle" fill="#ff9800" font-size="28" font-weight="700">🔥 南</text>
      <text x="350" y="460" text-anchor="middle" fill="rgba(255,152,0,.6)" font-size="16">火地</text>
      <!-- 北方标记 -->
      <circle cx="200" cy="180" r="60" fill="rgba(33,150,243,.08)" stroke="rgba(33,150,243,.3)" stroke-width="2">
        <animate attributeName="r" values="60;70;60" dur="2s" repeatCount="indefinite" begin="1s"/>
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <text x="200" y="175" text-anchor="middle" fill="#42a5f5" font-size="28" font-weight="700">💧 北</text>
      <text x="200" y="200" text-anchor="middle" fill="rgba(33,150,243,.6)" font-size="16">水地</text>
      <!-- 连线 -->
      <line x1="200" y1="240" x2="200" y2="380" stroke="rgba(201,168,76,.1)" stroke-width="2" stroke-dasharray="8,6"/>
      <line x1="350" y1="380" x2="350" y2="500" stroke="rgba(201,168,76,.1)" stroke-width="2" stroke-dasharray="8,6"/>
    </svg>
  </div>

  <div class="result-tag" id="resultGood">
    <span class="icon">📈</span>
    <div class="title">出生在南方火地</div>
    <div class="desc">金神喜火 → 事业提升<br><span class="dim">火炼真金，贵气彰显</span></div>
  </div>
  <div class="result-tag" id="resultBad">
    <span class="icon">⚠️</span>
    <div class="title">出生在北方水地</div>
    <div class="desc">金神遇水 → 金寒水冷<br><span class="dim">易被金属利器所伤</span></div>
  </div>
  <div class="vs-line" id="vsLine"></div>
</div>
<script>
(function(){
  setTimeout(function(){
    document.getElementById('resultGood').classList.add('show');
  },1800);
  setTimeout(function(){
    document.getElementById('resultBad').classList.add('show');
    document.getElementById('vsLine').classList.add('show');
  },2500);
})();
</script>
</body>
</html>
