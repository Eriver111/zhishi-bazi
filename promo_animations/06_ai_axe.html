<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>06 · AI 是把斧子</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0c0a;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}
/* 顶部 */
.top-text{position:absolute;top:300px;left:50%;transform:translateX(-50%);font-size:32px;color:#d8d0c0;letter-spacing:6px;text-align:center}
.top-text .hl{color:#e8cf70;font-weight:700}
/* 斧子 */
.axe-container{position:absolute;top:550px;left:50%;transform:translateX(-50%);text-align:center}
.axe{font-size:140px;display:block;transition:transform .8s}
.axe-label{font-size:24px;color:#e8cf70;letter-spacing:6px;margin-top:8px;font-weight:700}
/* 两条路 */
.path{position:absolute;top:950px;display:flex;gap:120px;left:50%;transform:translateX(-50%)}
.path-item{text-align:center;opacity:0;transition:all .8s}
.path-item.show{opacity:1}
.path-item .result{font-size:80px;display:block;margin-bottom:12px}
.path-item .label{font-size:24px;color:#d8d0c0;letter-spacing:3px;font-weight:700}
.path-item .desc{font-size:16px;color:#a09888;letter-spacing:2px;margin-top:6px}
.path-item.bad .label{color:#e57373}
.path-item.good .label{color:#81c784}
/* 底部结论 */
.conclusion{position:absolute;top:1500px;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .8s 2s}
.conclusion.show{opacity:1}
.conclusion .line{font-size:28px;color:#e8cf70;letter-spacing:4px;font-weight:700}
.conclusion .sub{font-size:20px;color:#a09888;letter-spacing:2px;margin-top:8px}
</style>
</head>
<body>
<div class="stage">
  <div class="top-text">
    <span class="hl">AI</span> 就像一把斧子
  </div>

  <div class="axe-container">
    <span class="axe" id="axe">🪓</span>
    <div class="axe-label">AI 算命</div>
  </div>

  <div class="path">
    <div class="path-item bad" id="pathBad">
      <span class="result">🌲</span>
      <div class="label">当聊天工具用</div>
      <div class="desc">随便问几句 · 不准就骂 AI 垃圾<br>就像拿斧子砍树——用错了地方</div>
    </div>
    <div class="path-item good" id="pathGood">
      <span class="result">🍜</span>
      <div class="label">当分析工具用</div>
      <div class="desc">结合数据库+实战案例+专业调校<br>就像拿斧子做筷子——精准高效</div>
    </div>
  </div>

  <div class="conclusion" id="conclusion">
    <div class="line">同一把斧子 · 看你怎么用</div>
    <div class="sub">工具没变，变的是使用方法</div>
  </div>
</div>
<script>
(function(){
  var axe=document.getElementById('axe');
  // 斧子摇摆
  var deg=0;var dir=1;
  setInterval(function(){
    deg+=dir*0.5;if(Math.abs(deg)>8)dir*=-1;
    axe.style.transform='rotate('+deg+'deg)';
  },50);

  setTimeout(function(){document.getElementById('pathBad').classList.add('show')},1200);
  setTimeout(function(){document.getElementById('pathGood').classList.add('show')},1800);
  setTimeout(function(){document.getElementById('conclusion').classList.add('show')},3000);
})();
</script>
</body>
</html>
