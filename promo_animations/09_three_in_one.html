<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>09 · 三合一验证</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0c0a;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}
/* 顶部标题 */
.title{position:absolute;top:300px;left:50%;transform:translateX(-50%);font-size:32px;color:#d8d0c0;letter-spacing:8px;text-align:center}
.title .hl{color:#e8cf70;font-weight:700}
/* 三张卡片 */
.card{position:absolute;width:260px;padding:30px 20px;background:rgba(24,22,18,.9);border:1px solid rgba(201,168,76,.15);border-radius:20px;text-align:center;transition:all 1s .5s}
.card .icon{font-size:64px;display:block;margin-bottom:12px}
.card .name{font-size:26px;color:#e8cf70;font-weight:700;letter-spacing:4px}
.card .desc{font-size:14px;color:#a09888;letter-spacing:2px;margin-top:8px;line-height:1.8}
#cardFace{top:550px;left:70px}
#cardBazi{top:550px;left:50%;transform:translateX(-50%)}
#cardPalm{top:550px;right:70px}
/* 汇聚后的状态 */
.card.merged{top:750px!important;left:50%!important;right:auto!important;transform:translateX(-50%) scale(.9)!important;opacity:0}
/* 对勾 */
.checkmark{position:absolute;top:900px;left:50%;transform:translate(-50%,-50%) scale(0);opacity:0;transition:all 1s 2s}
.checkmark.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.check-outer{width:200px;height:200px;border-radius:50%;border:4px solid #81c784;display:flex;align-items:center;justify-content:center;background:rgba(129,199,132,.05);box-shadow:0 0 80px rgba(129,199,132,.15)}
.check-inner{font-size:90px;color:#81c784}
/* 结论 */
.final-text{position:absolute;top:1250px;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .8s 2.5s}
.final-text.show{opacity:1}
.final-text .big{font-size:36px;color:#e8cf70;letter-spacing:8px;font-weight:700}
.final-text .mid{font-size:22px;color:#d8d0c0;letter-spacing:4px;margin-top:16px}
.final-text .small{font-size:18px;color:#a09888;letter-spacing:3px;margin-top:12px;line-height:1.8}
/* 光效 */
.glow-ring{position:absolute;top:900px;left:50%;width:300px;height:300px;border-radius:50%;border:1px solid rgba(129,199,132,.08);transform:translate(-50%,-50%);opacity:0;transition:all 1s 2.5s}
.glow-ring.show{opacity:1;width:500px;height:500px;border-color:rgba(129,199,132,.03)}
</style>
</head>
<body>
<div class="stage">
  <div class="title">
    三种结论 · 交叉验证<br><span class="hl">足不出户</span>，体验传统文化魅力
  </div>

  <!-- 八字卡片 -->
  <div class="card" id="cardFace">
    <span class="icon">👤</span>
    <div class="name">AI 观面</div>
    <div class="desc">《麻衣神相》<br>十二宫精解</div>
  </div>

  <!-- 八字卡片 -->
  <div class="card" id="cardBazi">
    <span class="icon">📜</span>
    <div class="name">八字排盘</div>
    <div class="desc">四柱大运流年<br>古法全流程</div>
  </div>

  <!-- 手相卡片 -->
  <div class="card" id="cardPalm">
    <span class="icon">🤚</span>
    <div class="name">AI 观手</div>
    <div class="desc">《神相全编》<br>八大掌纹分析</div>
  </div>

  <!-- 对勾 -->
  <div class="checkmark" id="checkmark">
    <div class="check-outer">
      <span class="check-inner">✓</span>
    </div>
  </div>
  <div class="glow-ring" id="glowRing"></div>

  <!-- 结论 -->
  <div class="final-text" id="finalText">
    <div class="big">三 合 一 · 验 真 知</div>
    <div class="mid">面相 + 八字 + 手相 → 交叉对照</div>
    <div class="small">一条结论可能不准，三条都指向同一件事——那就是真的<br>足不出户，AI 为你三线验证</div>
  </div>
</div>
<script>
(function(){
  // Phase 1: 卡片汇聚
  setTimeout(function(){
    document.getElementById('cardFace').classList.add('merged');
    document.getElementById('cardBazi').classList.add('merged');
    document.getElementById('cardPalm').classList.add('merged');
  },2000);

  // Phase 2: 对勾出现
  setTimeout(function(){
    document.getElementById('checkmark').classList.add('show');
    document.getElementById('glowRing').classList.add('show');
    // 隐藏卡片
    ['cardFace','cardBazi','cardPalm'].forEach(function(id){
      document.getElementById(id).style.display='none';
    });
  },3500);

  // Phase 3: 结论
  setTimeout(function(){
    document.getElementById('finalText').classList.add('show');
  },4000);
})();
</script>
</body>
</html>
