<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>05 · 后天努力</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0c0a;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}
/* 顶部 */
.top-label{position:absolute;top:300px;left:50%;transform:translateX(-50%);font-size:28px;color:#e8cf70;letter-spacing:6px;font-weight:700}
.top-label .small{font-size:18px;color:#a09888;letter-spacing:3px;display:block;margin-top:6px}
/* 两张名片 */
.card{position:absolute;width:340px;padding:40px 28px;background:rgba(24,22,18,.95);border:1px solid rgba(201,168,76,.2);border-radius:16px;text-align:center;transition:all .6s}
#cardA{top:550px;left:100px}
#cardB{top:550px;left:640px}
.card .pos{font-size:30px;color:#e8cf70;font-weight:700;letter-spacing:4px;margin-bottom:16px}
.card .org{font-size:20px;color:#d8d0c0;letter-spacing:3px}
.card .salary{font-size:24px;color:#a09888;margin-top:12px;letter-spacing:2px}
.card .tags{margin-top:16px}
.card .tags span{display:inline-block;padding:4px 12px;border-radius:12px;font-size:14px;margin:4px;letter-spacing:1px}
.tag-dim{background:rgba(255,255,255,.04);color:#a09888;border:1px solid rgba(255,255,255,.06)}
.tag-gold{background:rgba(201,168,76,.1);color:#e8cf70;border:1px solid rgba(201,168,76,.2)}
/* 对比线 */
.vs{position:absolute;top:650px;left:50%;transform:translateX(-50%);font-size:36px;color:rgba(201,168,76,.3);font-weight:900;letter-spacing:8px}
/* 覆盖层 */
.overlay{position:absolute;top:550px;left:50%;transform:translateX(-50%);font-size:72px;color:#e8cf70;font-weight:900;letter-spacing:12px;opacity:0;transition:all 1s .8s;text-align:center}
.overlay.show{opacity:1}
.overlay .sub{font-size:24px;color:#a09888;letter-spacing:4px;margin-top:10px;font-weight:400}
/* 渐变消失 */
.fade-out{opacity:.15;filter:blur(2px);transition:all .8s}
</style>
</head>
<body>
<div class="stage">
  <div class="top-label">官印相生 · 管理格局
    <span class="small">同一套八字，后天的选择决定高度</span>
  </div>

  <div class="card" id="cardA">
    <div class="pos">保安大队长</div>
    <div class="org">某小区物业</div>
    <div class="salary">月薪 4,500</div>
    <div class="tags"><span class="tag-dim">按部就班</span><span class="tag-dim">安稳度日</span></div>
  </div>

  <div class="vs" id="vsText">VS</div>

  <div class="card" id="cardB">
    <div class="pos">企业总监</div>
    <div class="org">某科技公司</div>
    <div class="salary">年薪 60 万</div>
    <div class="tags"><span class="tag-gold">持续学习</span><span class="tag-gold">主动争取</span></div>
  </div>

  <div class="overlay" id="overlay">
    后天努力
    <div class="sub">同样的格局 · 不同的选择 · 不同的结果</div>
  </div>
</div>
<script>
(function(){
  var a=document.getElementById('cardA');
  var b=document.getElementById('cardB');
  var vs=document.getElementById('vsText');
  var ov=document.getElementById('overlay');

  // Phase 1: cards visible (already visible)
  // Phase 2: blur/fade the cards
  setTimeout(function(){
    a.classList.add('fade-out');
    b.classList.add('fade-out');
    vs.style.opacity='0';
    vs.style.transition='opacity .6s';
  },2500);

  // Phase 3: overlay "后天努力" appears
  setTimeout(function(){
    ov.classList.add('show');
  },3300);
})();
</script>
</body>
</html>
