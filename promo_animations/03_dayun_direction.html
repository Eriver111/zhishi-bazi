<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>03 · 大运顺逆</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0c0a;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}
/* 顶部说明 */
.header{position:absolute;top:280px;left:50%;transform:translateX(-50%);text-align:center}
.header .bazi{font-size:48px;color:#e8cf70;letter-spacing:10px;font-weight:900;margin-bottom:12px}
.header .rule{font-size:24px;color:#a09888;letter-spacing:4px}
.header .rule span{color:#e8cf70;font-weight:700}
/* 时间轴 */
.timeline{position:absolute;top:750px;left:100px;width:880px;height:6px;background:rgba(201,168,76,.15);border-radius:3px}
.timeline-arrow{position:absolute;top:-8px;width:0;height:0;border:11px solid transparent}
#arrowRight{right:-20px;border-left:16px solid rgba(201,168,76,.4)}
#arrowLeft{left:-20px;border-right:16px solid rgba(201,168,76,.4)}
.timeline-nodes{position:absolute;top:-12px;width:100%;display:flex;justify-content:space-around}
.timeline-node{width:10px;height:10px;border-radius:50%;background:rgba(201,168,76,.3);transition:all .5s}
.timeline-node.passed{background:#e8cf70;box-shadow:0 0 10px rgba(201,168,76,.5)}
/* 人物 */
.person{position:absolute;top:820px;text-align:center;transition:left 3s linear}
.person .icon{font-size:60px;display:block}
.person .label{font-size:18px;color:#d8d0c0;letter-spacing:2px;margin-top:4px}
.person .age{font-size:14px;color:#a09888;margin-top:2px}
#personM{left:120px}
#personF{left:820px}
.person.walk{animation:walkBob .4s ease-in-out infinite}
@keyframes walkBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* 标签 */
.tag{position:absolute;font-size:22px;font-weight:700;letter-spacing:4px;padding:8px 20px;border-radius:20px}
.tag.good{background:rgba(129,199,132,.1);color:#81c784;border:1px solid rgba(129,199,132,.25)}
.tag.bad{background:rgba(229,115,115,.1);color:#e57373;border:1px solid rgba(229,115,115,.15)}
#tagM{top:1050px;left:220px;opacity:0;transition:opacity .6s 1.5s}
#tagF{top:1050px;left:660px;opacity:0;transition:opacity .6s 2.5s}
.tag.show{opacity:1}
/* 底部说明 */
.note{position:absolute;top:1300px;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .8s 3s}
.note.show{opacity:1}
.note .line1{font-size:36px;color:#e8cf70;letter-spacing:6px;font-weight:700}
.note .line2{font-size:22px;color:#a09888;letter-spacing:3px;margin-top:12px}
/* 年份节点标签 */
.tl-label{position:absolute;top:770px;font-size:14px;color:#a09888;letter-spacing:2px}
</style>
</head>
<body>
<div class="stage">
  <div class="header">
    <div class="bazi">丙 戌 年 · 阳年</div>
    <div class="rule">阳年：<span>男顺排</span> · <span>女逆排</span></div>
  </div>

  <!-- 时间轴 -->
  <div class="timeline" id="timeline">
    <div class="timeline-arrow" id="arrowRight"></div>
    <div class="timeline-arrow" id="arrowLeft"></div>
  </div>
  <div class="tl-label" style="left:115px">0岁</div>
  <div class="tl-label" style="left:260px">20</div>
  <div class="tl-label" style="left:405px">40</div>
  <div class="tl-label" style="left:550px">60</div>
  <div class="tl-label" style="left:695px">80</div>

  <!-- 男性：顺排 -->
  <div class="person" id="personM">
    <span class="icon">👨</span>
    <div class="label">男命 · 顺排</div>
    <div class="age" id="ageM">0岁</div>
  </div>

  <!-- 女性：逆排 -->
  <div class="person" id="personF">
    <span class="icon">👩</span>
    <div class="label">女命 · 逆排</div>
    <div class="age" id="ageF">80岁</div>
  </div>

  <!-- 运程标签 -->
  <div class="tag good" id="tagM">前20年走好运 ↗</div>
  <div class="tag bad" id="tagF">前20年走背运 ↘</div>

  <div class="note" id="note">
    <div class="line1">性别不同 · 走运的时间各不相同</div>
    <div class="line2">阴年则相反——男逆女顺</div>
  </div>
</div>
<script>
(function(){
  var m=document.getElementById('personM');
  var f=document.getElementById('personF');
  var tm=document.getElementById('tagM');
  var tf=document.getElementById('tagF');
  var nt=document.getElementById('note');
  // 男向右走
  var start=Date.now();
  function anim(){
    var elapsed=(Date.now()-start)/1000;
    // 男顺排：向右走 0→80
    var mp=120+(elapsed*60);if(mp>550)mp=550;
    m.style.left=mp+'px';
    if(elapsed>0.3){m.classList.add('walk')}
    document.getElementById('ageM').textContent=Math.floor(elapsed*6)+'岁';
    // 女逆排：向左走 820→100
    var fp=820-(elapsed*60);if(fp<120)fp=120;
    f.style.left=fp+'px';
    if(elapsed>0.3){f.classList.add('walk')}
    document.getElementById('ageF').textContent=Math.max(0,80-Math.floor(elapsed*6))+'岁';
    // 标签出现
    if(elapsed>1.5)tm.classList.add('show');
    if(elapsed>2.5)tf.classList.add('show');
    if(elapsed>3)nt.classList.add('show');
    if(elapsed<9){requestAnimationFrame(anim)}
  }
  setTimeout(anim,500);
})();
</script>
</body>
</html>
