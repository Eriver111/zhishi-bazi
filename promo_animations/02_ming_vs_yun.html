<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>02 · 命与运</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0c0a;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}
/* 命：巨石般沉稳 */
.ming-container{position:absolute;top:500px;left:50%;transform:translateX(-50%);text-align:center}
.ming-char{font-size:200px;font-weight:900;color:#e8cf70;letter-spacing:20px;position:relative}
.ming-char::after{content:'';position:absolute;bottom:-10px;left:10%;width:80%;height:6px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.4),transparent)}
.ming-label{font-size:22px;color:#a09888;letter-spacing:6px;margin-top:16px}
.ming-desc{font-size:18px;color:#6a6258;letter-spacing:3px;margin-top:8px;opacity:0;transition:opacity 1s 1.5s}
.ming-desc.show{opacity:1}
/* 运：流水的轨迹 */
.yun-track{position:absolute;top:900px;left:0;width:100%;height:300px;overflow:visible}
.yun-svg{width:100%;height:100%}
.yun-text{position:absolute;font-size:200px;font-weight:900;letter-spacing:20px;color:transparent;
  background:linear-gradient(90deg,#4fc3f7,#29b6f6,#03a9f4,#29b6f6,#4fc3f7);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
  animation:flowGradient 3s linear infinite}
@keyframes flowGradient{0%{background-position:0 0}100%{background-position:-200% 0}}
.yun-group{position:absolute;top:920px;left:50%;transform:translateX(-50%);text-align:center;
  opacity:0;transition:opacity 1s 1s}
.yun-group.show{opacity:1}
.yun-desc{font-size:18px;color:#81d4fa;letter-spacing:3px;margin-top:180px}
/* 底部小结 */
.summary{position:absolute;top:1500px;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .8s 2.5s}
.summary.show{opacity:1}
.summary p{font-size:28px;color:#d8d0c0;letter-spacing:6px;line-height:1.8}
.summary p span.hl{color:#e8cf70;font-weight:700}
/* 粒子河流 */
.particles{position:absolute;top:1020px;left:0;width:100%;height:80px}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#4fc3f7;opacity:.6;animation:drift 4s linear infinite}
@keyframes drift{0%{transform:translateX(0) translateY(0);opacity:.6}50%{opacity:1}100%{transform:translateX(900px) translateY(-30px);opacity:0}}
</style>
</head>
<body>
<div class="stage">
  <!-- 命 -->
  <div class="ming-container">
    <div class="ming-char">命</div>
    <div class="ming-label">出 生 即 定</div>
    <div class="ming-desc" id="mingDesc">八字原局 · 不可改变</div>
  </div>

  <!-- 运 -->
  <div class="yun-group" id="yunGroup">
    <div class="yun-text">运</div>
    <div class="yun-desc">大运 · 流年 · 出生地 · 家庭 · 后天选择</div>
  </div>

  <!-- 粒子 -->
  <div class="particles" id="particles"></div>

  <!-- 小结 -->
  <div class="summary" id="summary">
    <p><span class="hl">命</span>是一副牌 · <span class="hl">运</span>是打法</p>
    <p style="font-size:22px;color:#a09888;margin-top:12px">牌不能换，但怎么打，你说了算</p>
  </div>
</div>
<script>
(function(){
  // 粒子
  var pc=document.getElementById('particles');
  for(var i=0;i<30;i++){
    var p=document.createElement('div');
    p.className='particle';
    p.style.left=(Math.random()*100)+'%';
    p.style.top=(Math.random()*100)+'%';
    p.style.animationDelay=(Math.random()*4)+'s';
    p.style.animationDuration=(3+Math.random()*3)+'s';
    pc.appendChild(p);
  }
  setTimeout(function(){
    document.getElementById('mingDesc').classList.add('show');
  },500);
  setTimeout(function(){
    document.getElementById('yunGroup').classList.add('show');
  },1500);
  setTimeout(function(){
    document.getElementById('summary').classList.add('show');
  },3000);
})();
</script>
</body>
</html>
