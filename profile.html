<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.profile-page{max-width:600px;margin:80px auto 40px;padding:0 20px}
.profile-page h1{text-align:center;font-size:24px;color:var(--gold-l);letter-spacing:6px;margin-bottom:6px}
.profile-page .sub{text-align:center;font-size:12px;color:var(--tx3);margin-bottom:32px;letter-spacing:2px}
.chart-card{
  display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;
  padding:18px 20px;margin-bottom:12px;text-decoration:none;transition:all .25s;
  position:relative;overflow:hidden;
}
.chart-card:hover{border-color:var(--bd2);transform:translateY(-1px)}
.chart-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.15),transparent)}
.chart-card .label{font-size:15px;color:var(--tx);font-weight:600;margin-bottom:4px}
.chart-card .meta{font-size:11px;color:var(--tx3);display:flex;justify-content:space-between}
.chart-card .arrow{color:var(--gold);font-size:18px;position:absolute;right:20px;top:50%;transform:translateY(-50%)}
.chart-card .del{position:absolute;right:12px;top:8px;background:none;border:none;color:var(--tx3);font-size:10px;cursor:pointer;opacity:0;transition:opacity .2s}
.chart-card:hover .del{opacity:1}
.empty-state{text-align:center;padding:60px 20px;color:var(--tx3)}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.5}
.empty-state p{font-size:13px;line-height:2}
.login-prompt{text-align:center;padding:60px 20px}
.login-prompt .btn{padding:12px 32px;border-radius:25px;font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--ink);border:none}
.profile-customer-service{margin:24px 0 0;padding:20px;border:1px solid rgba(181,64,56,.22);border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(250,247,239,.94));box-shadow:0 10px 24px rgba(68,54,40,.08)}
.profile-customer-service__kicker{margin:0 0 6px;color:#a55044;font-size:11px;font-weight:700;letter-spacing:2px}
.profile-customer-service__title{margin:0;color:var(--tx);font-size:19px}
.profile-customer-service__body{margin:10px 0 14px;color:var(--tx2);font-size:13px;line-height:1.75}
.profile-customer-service__wechat{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:10px;background:rgba(67,126,89,.08);color:var(--tx2);font-size:12px}
.profile-customer-service__id{color:#2f7550;font-size:16px;font-weight:800;letter-spacing:1px}
.profile-customer-service__actions{display:flex;gap:10px;margin-top:14px}
.profile-customer-service__action{flex:1;min-height:44px;padding:10px 14px;border-radius:9px;font:600 13px/1 inherit;cursor:pointer}
.profile-customer-service__action--primary{border:1px solid #b95047;background:#b95047;color:#fff}
.profile-customer-service__action--secondary{border:1px solid rgba(67,126,89,.35);background:rgba(67,126,89,.08);color:#2f7550}
.profile-customer-service__status{min-height:18px;margin:10px 0 0;color:var(--tx3);font-size:12px}
.profile-feedback{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(38,32,27,.44);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.profile-feedback[hidden]{display:none}
.profile-feedback__form{position:relative;width:min(100%,480px);padding:24px;border:1px solid rgba(181,64,56,.22);border-radius:16px;background:#fffdf8;box-shadow:0 22px 60px rgba(49,38,29,.22)}
.profile-feedback__title{margin:0 40px 8px 0;color:#302c27;font-size:21px}
.profile-feedback__intro{margin:0 0 18px;color:#6d655d;font-size:13px;line-height:1.7}
.profile-feedback__close{position:absolute;top:14px;right:14px;width:36px;height:36px;border:0;border-radius:50%;background:#f3eee5;color:#625a52;font-size:22px;line-height:1;cursor:pointer}
.profile-feedback__label{display:block;margin:14px 0 7px;color:#3c3732;font-size:13px;font-weight:700}
.profile-feedback__field{box-sizing:border-box;width:100%;padding:11px 12px;border:1px solid #d8cfc3;border-radius:9px;background:#fff;color:#302c27;font:14px/1.5 inherit;outline:none}
.profile-feedback__field:focus{border-color:#a55044;box-shadow:0 0 0 3px rgba(165,80,68,.12)}
textarea.profile-feedback__field{min-height:128px;resize:vertical}
.profile-feedback__submit{width:100%;min-height:44px;margin-top:18px;border:1px solid #b95047;border-radius:9px;background:#b95047;color:#fff;font:700 14px/1 inherit;cursor:pointer}
.profile-feedback__submit:disabled{cursor:wait;opacity:.65}
.profile-feedback__status{min-height:20px;margin:10px 0 0;color:#735149;font-size:12px;line-height:1.6}
@media (max-width:480px){.profile-customer-service__wechat{align-items:flex-start;flex-direction:column}.profile-customer-service__actions{flex-direction:column}.profile-customer-service__action{min-height:44px}.profile-feedback{align-items:flex-end;padding:12px}.profile-feedback__form{max-height:calc(100vh - 24px);overflow:auto;padding:20px;border-radius:14px}}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-spinner{display:inline-block;width:24px;height:24px;border:2px solid rgba(201,168,76,.1);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
</style>
<link rel="stylesheet" href="css/theme-light.css?v=3">
<link rel="stylesheet" href="css/theme-light-pages.css?v=1">
</head>
<body>
<div id="zhishi-nav" style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(28,26,22,.92);border-bottom:1px solid rgba(201,168,76,.1);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px"><a href="/" style="font-size:18px;font-weight:900;letter-spacing:4px;color:#e8cf70;text-decoration:none;margin-right:8px">知时</a><div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap"><a href="/paipan" style="color:#a09888;text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap">八字排盘</a><a href="/ziwei" style="color:#a09888;text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap">紫微斗数</a><a href="/fengshui" style="color:#a09888;text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap">风水</a><a href="/face" style="color:#a09888;text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap">观面</a><a href="/palm" style="color:#a09888;text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap">观手</a><div style="position:relative;display:inline-block" onmouseenter="this.querySelector('.dd-menu').style.display='block'" onmouseleave="this.querySelector('.dd-menu').style.display='none'"><span onclick="var m=this.nextElementSibling;m.style.display=m.style.display=='block'?'none':'block'" style="color:#a09888;cursor:pointer;padding:6px 10px;border-radius:6px;white-space:nowrap;user-select:none">更多 ▾</span><div class="dd-menu" style="display:none;position:absolute;top:100%;left:0;background:rgba(28,26,22,.96);border:1px solid rgba(201,168,76,.15);border-radius:8px;padding:4px 0;min-width:120px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.6)"><a href="/hepan" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">合盘缘分</a><a href="/fortune" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">今日运势</a><a href="/meihua" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">梅花易数</a><a href="/liuyao" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">六爻占卜</a><a href="/liuren" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">大六壬</a><a href="/profile" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">个人中心</a></div></div><a href="/pricing" style="color:#c9a84c;text-decoration:none;padding:6px 10px;border-radius:6px;border:1px solid rgba(201,168,76,.25);white-space:nowrap">积分</a><span id="nav-user-area" class="nav-user" style="margin-left:4px;font-size:12px"></span></div></div>


<div class="profile-page">
  <h1>我的档案</h1>
  <div class="sub">积分 · 记录 · 排盘</div>
  <div id="content"></div>
  <section id="profileCustomerService" class="profile-customer-service" aria-labelledby="profileCustomerServiceTitle">
    <p class="profile-customer-service__kicker">使用帮助</p>
    <h2 id="profileCustomerServiceTitle" class="profile-customer-service__title">联系客服</h2>
    <p class="profile-customer-service__body">支付、报告恢复或使用异常，都可以联系我们。</p>
    <div class="profile-customer-service__wechat"><span>微信号</span><strong class="profile-customer-service__id">EriverLife</strong></div>
    <div class="profile-customer-service__actions">
      <button id="profileWechatCopy" class="profile-customer-service__action profile-customer-service__action--primary" type="button" onclick="copyProfileWechat(this)">复制微信号</button>
      <button class="profile-customer-service__action profile-customer-service__action--secondary" type="button" onclick="openProfileFeedback(this)">问题反馈</button>
    </div>
    <p id="profileCustomerServiceStatus" class="profile-customer-service__status" aria-live="polite"></p>
  </section>
</div>

<div id="profileFeedbackDialog" class="profile-feedback" role="dialog" aria-modal="true" aria-labelledby="profileFeedbackTitle" hidden>
  <form class="profile-feedback__form" onsubmit="submitProfileFeedback(); return false;">
    <button class="profile-feedback__close" type="button" aria-label="关闭" onclick="closeProfileFeedback()">×</button>
    <h2 id="profileFeedbackTitle" class="profile-feedback__title">问题反馈</h2>
    <p class="profile-feedback__intro">请描述遇到的问题，我们会尽快查看。</p>
    <label class="profile-feedback__label" for="profileFeedbackMessage">问题或建议</label>
    <textarea class="profile-feedback__field" id="profileFeedbackMessage" maxlength="500"></textarea>
    <label class="profile-feedback__label" for="profileFeedbackContact">联系方式（选填）</label>
    <input class="profile-feedback__field" id="profileFeedbackContact" maxlength="100" autocomplete="contact">
    <button class="profile-feedback__submit" id="profileFeedbackSubmit" type="submit">提交反馈</button>
    <p class="profile-feedback__status" id="profileFeedbackStatus" role="status"></p>
  </form>
</div>

<script src="js/auth.js"></script>
<script>
(function(){
  var profileFeedbackOpener = null;
  var profileFeedbackSubmitting = false;

  function setProfileCustomerServiceStatus(message) {
    var status = document.getElementById('profileCustomerServiceStatus');
    if (status) status.textContent = message;
  }

  function setProfileFeedbackStatus(message) {
    var status = document.getElementById('profileFeedbackStatus');
    if (status) status.textContent = message;
  }

  function temporaryButtonMessage(button, message) {
    var originalText = button.textContent;
    button.textContent = message;
    setTimeout(function() { button.textContent = originalText; }, 2000);
  }

  function fallbackCopyProfileWechat() {
    var textarea = document.createElement('textarea');
    textarea.value = 'EriverLife';
    textarea.setAttribute('readonly', '');
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    try {
      textarea.select();
      return document.execCommand('copy');
    } catch (error) {
      return false;
    } finally {
      document.body.removeChild(textarea);
    }
  }

  window.copyProfileWechat = function(button) {
    function onCopied() {
      temporaryButtonMessage(button, '已复制');
      setProfileCustomerServiceStatus('微信号已复制，可以直接添加客服。');
      return true;
    }

    function onCopyFailed() {
      temporaryButtonMessage(button, '请手动复制');
      setProfileCustomerServiceStatus('复制失败，请手动添加微信号 EriverLife。');
      return false;
    }

    function useFallback() {
      return fallbackCopyProfileWechat() ? onCopied() : onCopyFailed();
    }

    if (typeof navigator !== 'undefined' && navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      try {
        return Promise.resolve(navigator.clipboard.writeText('EriverLife')).then(onCopied, useFallback);
      } catch (error) {
        return Promise.resolve(useFallback());
      }
    }
    return Promise.resolve(useFallback());
  };

  window.openProfileFeedback = function(opener) {
    var dialog = document.getElementById('profileFeedbackDialog');
    var message = document.getElementById('profileFeedbackMessage');
    if (!dialog || !message) return;
    profileFeedbackOpener = opener || document.activeElement;
    setProfileFeedbackStatus('');
    dialog.hidden = false;
    message.focus();
  };

  window.closeProfileFeedback = function() {
    var dialog = document.getElementById('profileFeedbackDialog');
    if (!dialog || dialog.hidden) return;
    dialog.hidden = true;
    if (profileFeedbackOpener && typeof profileFeedbackOpener.focus === 'function') {
      profileFeedbackOpener.focus();
    }
    profileFeedbackOpener = null;
  };

  window.showProfileFeedback = window.openProfileFeedback;

  window.submitProfileFeedback = function() {
    if (profileFeedbackSubmitting) return Promise.resolve(false);

    var messageField = document.getElementById('profileFeedbackMessage');
    var contactField = document.getElementById('profileFeedbackContact');
    var submitButton = document.getElementById('profileFeedbackSubmit');
    var message = messageField.value.trim();
    var contact = contactField.value.trim();

    if (!message) {
      setProfileFeedbackStatus('请先填写问题或建议。');
      messageField.focus();
      return Promise.resolve(false);
    }

    profileFeedbackSubmitting = true;
    submitButton.disabled = true;
    submitButton.textContent = '提交中…';

    var request;
    try {
      request = fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message, contact: contact, page: 'profile' })
      });
    } catch (error) {
      request = Promise.reject(error);
    }

    return Promise.resolve(request)
      .then(function(response) {
        if (!response.ok) throw new Error('request failed');
        return response.json();
      })
      .then(function(data) {
        if (data && data.error) throw new Error(data.error);
        setProfileFeedbackStatus('已提交，我们会尽快查看。');
        return true;
      })
      .catch(function() {
        setProfileFeedbackStatus('提交失败，请复制微信号联系我们。');
        return false;
      })
      .then(function(result) {
        profileFeedbackSubmitting = false;
        submitButton.disabled = false;
        submitButton.textContent = '提交反馈';
        return result;
      });
  };

  if (document.addEventListener) {
    document.addEventListener('keydown', function(event) {
      var dialog = document.getElementById('profileFeedbackDialog');
      if (event.key === 'Escape' && dialog && !dialog.hidden) {
        event.preventDefault();
        closeProfileFeedback();
      }
    });
  }

  var content = document.getElementById('content');

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function reportUrl(report) {
    var params = report.report_params || {};
    var query = new URLSearchParams();
    if (params.mode === 'pillars' && params.pillars) {
      var keys = { year:['yg','yz'], month:['mg','mz'], day:['dg','dz'], hour:['hg','hz'] };
      Object.keys(keys).forEach(function(position) {
        var value = params.pillars[position] || '';
        query.set(keys[position][0], value.charAt(0));
        query.set(keys[position][1], value.charAt(1));
      });
      query.set('mode', 'pillars');
      query.set('timing', params.timing || 'unknown');
    } else {
      if (params.mode === 'lunar') query.set('cal', 'lunar');
      query.set('zishi', params.ziHourRule === 'next-day' ? '1' : '0');
      query.set('solar', params.trueSolarTime === 'disabled' ? '0' : '1');
    }
    ['year','month','day','hour','clock','minute','gender','prov','city','dist']
      .forEach(function(key) {
        if (params[key] !== undefined && params[key] !== '') query.set(key, params[key]);
      });
    return '/result?' + query.toString();
  }

  function render() {
    if (typeof Auth === 'undefined') return setTimeout(render, 300);
    // 登录成功后自动刷新
    Auth.onLogin(function() { render(); });
    Auth.ready(function() {
    if (!Auth.isLoggedIn()) {
      content.innerHTML =
        '<div class="login-prompt">' +
        '<div class="empty-state"><div class="icon">🔐</div><p>登录后可查看积分余额和排盘记录</p></div>' +
        '<button class="btn" onclick="Auth.showModal(\'login\')">登录</button>' +
        '</div>';
      return;
    }

    // 先显示加载状态
    content.innerHTML = '<div style="text-align:center;padding:40px"><div class="loading-spinner"></div></div>';

    // 并行加载积分+排盘
    var p1 = fetch('/api/auth/profile', { headers: { 'Authorization': 'Bearer ' + Auth.getToken() } })
      .then(function(r){return r.json()})
      .catch(function(){ return { error:true }; });
    var p2 = Auth.getData('saved_charts').catch(function(){ return '[]'; });
    var p3 = fetch('/api/reports', {
      headers:{ Authorization:'Bearer ' + Auth.getToken() }
    }).then(function(r){ return r.ok ? r.json() : { reports:[] }; })
      .catch(function(){ return { reports:[] }; });

    Promise.all([p1, p2, p3]).then(function(results){
      var profile = results[0];
      var charts = [];
      var reports = (results[2] && results[2].reports) || [];
      try { charts = JSON.parse(results[1] || '[]'); } catch(e) {}

      var html = '';
      // 积分卡片
      if (!profile.error) {
        html += '<div class="chart-card" style="margin-bottom:16px">';
        html += '<div style="display:flex;justify-content:space-between;align-items:center">';
        html += '<div><div style="font-size:11px;color:var(--tx3);letter-spacing:2px">积分余额</div>';
        html += '<div style="font-size:28px;font-weight:900;color:var(--gold-l)">' + (profile.is_monthly ? '∞' : (profile.credits||0)) + '</div>';
        html += '<div style="font-size:11px;color:var(--tx2)">' + (profile.is_monthly ? '月度会员 · '+(profile.monthly_expires||'').slice(0,10)+'到期' : '剩余次数') + '</div></div>';
        html += '<a href="/pricing" class="btn" style="text-decoration:none;padding:8px 16px;font-size:12px;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--ink);border-radius:20px;font-weight:600;letter-spacing:1px">购买</a>';
        html += '</div></div>';

        // 兑换码输入
        html += '<div style="margin-top:16px;padding:14px;background:rgba(201,168,76,.04);border:1px solid rgba(201,168,76,.12);border-radius:10px">';
        html += '<div style="font-size:10px;color:var(--tx3);letter-spacing:2px;margin-bottom:8px">使用兑换码</div>';
        html += '<div style="display:flex;gap:8px"><input id="redeemInput" placeholder="输入8位兑换码" maxlength="20" style="flex:1;padding:8px 12px;font-size:13px;background:rgba(30,28,24,.6);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:var(--tx);font-family:monospace;letter-spacing:2px;outline:none;text-transform:uppercase"><button onclick="redeemCode()" style="padding:8px 16px;font-size:13px;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--ink);border:none;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap">兑换</button></div>';
        html += '<div id="redeemMsg" style="margin-top:6px;font-size:11px"></div></div>';

        var myInviteCode='ZS'+String((Auth.getUser()&&Auth.getUser().id)||'0').padStart(6,'0');
        html+='<div style="margin-top:16px;padding:14px;background:rgba(201,168,76,.04);border:1px solid rgba(201,168,76,.12);border-radius:10px">';
        html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div><div style="font-size:10px;color:var(--tx3);letter-spacing:2px">我的邀请码</div><div style="font-size:20px;font-weight:700;color:var(--gold-l);letter-spacing:3px;font-family:monospace">'+myInviteCode+'</div></div><button onclick="navigator.clipboard.writeText(\''+myInviteCode+'\');var t=this;t.textContent=\'已复制\';setTimeout(function(){t.textContent=\'复制\'},2000)" style="padding:6px 12px;font-size:11px;background:rgba(201,168,76,.1);border:1px solid var(--bd2);color:var(--gold);border-radius:12px;cursor:pointer">复制</button></div>';
        html+='<div style="font-size:10px;color:var(--tx3);margin-bottom:8px">分享邀请码给好友，对方输入后双方各得 2 次积分</div>';
        html+='<div style="display:flex;gap:8px"><input id="inviteInput" placeholder="输入好友的邀请码" style="flex:1;padding:8px 12px;font-size:13px;background:rgba(30,28,24,.6);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:var(--tx);font-family:inherit;outline:none"><button onclick="redeemInvite()" style="padding:8px 16px;font-size:13px;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--ink);border:none;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap">兑换</button></div>';
        html+='<div id="inviteMsg" style="margin-top:6px;font-size:11px"></div></div>';

        // 我的购买 — 兑换码列表
        if (profile.history && profile.history.length) {
          html += '<h3 style="font-size:13px;color:var(--tx3);letter-spacing:2px;margin-top:16px;margin-bottom:8px">我的购买</h3>';
          profile.history.forEach(function(h){
            var codeHtml = '';
            if (h.code) {
              codeHtml = '<div style="display:flex;align-items:center;gap:6px;margin-top:4px">'
                + '<code style="font-size:13px;font-weight:700;color:#e8d070;letter-spacing:2px;font-family:monospace;user-select:all;background:rgba(0,0,0,.2);padding:3px 8px;border-radius:4px">' + h.code + '</code>'
                + '<button onclick="var c=\'' + h.code + '\';navigator.clipboard.writeText(c).then(function(){var b=this;b.textContent=\'✅\';setTimeout(function(){b.textContent=\'📋\'},1500)}.bind(this))" style="background:none;border:1px solid rgba(201,168,76,.2);color:var(--gold);border-radius:4px;cursor:pointer;font-size:12px;padding:2px 6px" title="复制">📋</button>'
                + '</div>';
            }
            html += '<div style="padding:10px 12px;margin-bottom:6px;background:rgba(201,168,76,.03);border:1px solid rgba(201,168,76,.08);border-radius:10px;font-size:12px">';
            html += '<div style="display:flex;justify-content:space-between;align-items:center">';
            html += '<span><b style="color:var(--gold-l)">' + h.type + '</b> ' + h.detail + '</span>';
            html += '<span style="color:var(--tx3);font-size:10px">' + (h.date||'').slice(0,10) + '</span></div>';
            html += codeHtml;
            html += '</div>';
          });
        } else if (!profile.error) {
          html += '<div style="text-align:center;padding:16px;color:var(--tx3);font-size:12px">暂无购买记录</div>';
        }      }

      // 排盘记录
      html += '<h3 style="font-size:13px;color:var(--tx3);letter-spacing:2px;margin-top:16px;margin-bottom:8px">排盘记录</h3>';
      if (charts.length === 0) {
        html += '<div class="empty-state" style="padding:30px"><p style="font-size:12px">还没有排盘记录</p></div>';
      } else {
        charts.forEach(function(c, i) {
          html += '<div class="chart-card" style="cursor:pointer" onclick="location.href=\'/result?' + c.params + '\'">' +
            '<button class="del" onclick="event.stopPropagation();deleteChart(' + i + ')">删除</button>' +
            '<div class="label">' + c.label + '</div>' +
            '<div class="meta"><span>' + (c.saved_at ? c.saved_at.slice(0,10) : '') + '</span></div>' +
            '<span class="arrow">→</span></div>';
        });
      }
      html += '<h3 style="font-size:13px;color:var(--tx3);letter-spacing:2px;margin-top:16px;margin-bottom:8px">我的深度报告</h3>';
      if (reports.length === 0) {
        html += '<div class="empty-state" style="padding:30px"><p style="font-size:12px">还没有已购报告</p></div>';
      } else {
        reports.forEach(function(report) {
          html += '<a class="chart-card" href="' + esc(reportUrl(report)) + '">' +
            '<div class="label">' + esc(report.label || '深度报告') + '</div>' +
            '<div class="meta"><span>' + esc((report.paid_at || '').slice(0,10)) + '</span><span>查看报告</span></div>' +
            '<span class="arrow">→</span></a>';
        });
      }
      content.innerHTML = html;
    }).catch(function(e){ content.innerHTML = '<div class="empty-state"><p>加载失败：'+ (e&&e.message||'请确认已登录并刷新') +'</p><button class="btn" onclick="location.reload()" style="margin-top:12px">重新加载</button></div>'; });
  });
  }

  window.redeemCode=function(){
    var code=document.getElementById("redeemInput").value.trim().toUpperCase();
    var msg=document.getElementById("redeemMsg");
    if(!code){msg.innerHTML="<span style=color:#F44336>请输入兑换码</span>";return;}
    if(code.length<4){msg.innerHTML="<span style=color:#F44336>兑换码格式不正确</span>";return;}
    if(!Auth.isLoggedIn()){Auth.showModal("login");return;}
    msg.innerHTML="兑换中...";
    fetch("/api/credits",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+Auth.getToken()},body:JSON.stringify({action:"activate",code:code})})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){msg.innerHTML="<span style=color:#4CAF50>✅ "+d.message+"</span>";setTimeout(function(){location.reload()},1500);}
      else msg.innerHTML="<span style=color:#F44336>"+(d.error||"兑换失败，请检查兑换码是否正确")+"</span>";
    }).catch(function(){msg.innerHTML="<span style=color:#F44336>网络异常，请重试</span>";});
  };

  window.redeemInvite=function(){
    var code=document.getElementById("inviteInput").value.trim();
    var msg=document.getElementById("inviteMsg");
    if(!code){msg.innerHTML="<span style=color:#F44336>请输入邀请码</span>";return;}
    if(!Auth.isLoggedIn()){Auth.showModal("login");return;}
    msg.innerHTML="兑换中...";
    fetch("/api/referral",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+Auth.getToken()},body:JSON.stringify({inviteCode:code})})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success)msg.innerHTML="<span style=color:#4CAF50>"+d.message+"</span>";
      else msg.innerHTML="<span style=color:#F44336>"+(d.message||d.error||"兑换失败")+"</span>";
    }).catch(function(){msg.innerHTML="<span style=color:#F44336>网络异常</span>";});
  };

  window.deleteChart = function(i) {
    if (!confirm('确定删除这条记录？')) return;
    Auth.getData('saved_charts').then(function(val) {
      var charts = [];
      try { charts = JSON.parse(val || '[]'); } catch(e) {}
      charts.splice(i, 1);
      Auth.syncData('saved_charts', JSON.stringify(charts)).then(function() {
        render();
      });
    });
  };

  render();
})();
</script>
</body>
</html>
