<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>渠道分成后台</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<style>
:root{--ink:#080c14;--card:rgba(13,21,37,.82);--gold:#c9a84c;--gold-l:#e8cf70;--tx:#e2dcc8;--tx2:#a09888;--tx3:#8a8580;--bd:rgba(201,168,76,.1);--red:#F44336;--green:#4CAF50}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--tx);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.header{background:rgba(13,21,37,.95);border-bottom:1px solid var(--bd);padding:20px 24px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:20px;color:var(--gold-l);letter-spacing:4px}
.header .refresh{font-size:12px;color:var(--tx3);cursor:pointer;padding:8px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px}
.login-box{max-width:400px;margin:100px auto;text-align:center;padding:40px;background:var(--card);border-radius:12px;border:1px solid var(--bd)}
.login-box input{width:100%;padding:14px;margin:12px 0;font-size:16px;background:rgba(20,20,36,.6);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:var(--tx);text-align:center;font-family:inherit;outline:none}
.login-box input:focus{border-color:var(--gold)}
.login-box button{width:100%;padding:14px;font-size:16px;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:var(--ink);border:none;border-radius:8px;cursor:pointer;letter-spacing:4px;font-family:inherit}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px;text-align:center}
.stat-card .stat-val{font-size:36px;font-weight:900;margin:8px 0}
.stat-card .stat-label{font-size:12px;color:var(--tx3);letter-spacing:2px}
.breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.break-card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;text-align:center}
.break-card .b-name{font-size:13px;color:var(--tx3);letter-spacing:2px;margin-bottom:8px}
.break-card .b-count{font-size:20px;font-weight:700;color:var(--gold)}
.break-card .b-sub{font-size:12px;color:var(--tx2);margin-top:4px}
.order-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.order-table th{text-align:left;padding:10px 12px;color:var(--tx3);font-size:11px;letter-spacing:2px;border-bottom:1px solid var(--bd)}
.order-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--tx2)}
.loading{text-align:center;padding:60px;color:var(--tx3)}.loading .s{display:inline-block;width:32px;height:32px;border:2px solid rgba(201,168,76,.1);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){.stats-row{grid-template-columns:1fr 1fr}.breakdown{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="header"><h1>渠道分成后台</h1><span class="refresh" onclick="load()">刷新</span></div>
<div class="login-box" id="loginBox"><h3 style="color:var(--gold-l);letter-spacing:4px;margin-bottom:16px">渠道商登录</h3><input id="keyInput" type="password" placeholder="管理密码"><button onclick="login()">进入后台</button></div>
<div id="dashboard" style="display:none;max-width:1100px;margin:0 auto;padding:24px"></div>
<script>
var KEY='',CH='knowbazi';
function login(){var k=document.getElementById('keyInput').value.trim();if(!k)return;KEY=k;load()}
function load(){
  if(!KEY)return;
  var db=document.getElementById('dashboard');
  document.getElementById('loginBox').style.display='none';
  db.style.display='block';
  db.innerHTML='<div class="loading"><div class="s"></div><p>加载中...</p></div>';
  fetch('/api/channel-stats?ch='+CH+'&key='+encodeURIComponent(KEY))
  .then(function(r){return r.json()}).then(function(d){
    if(d.error){db.innerHTML='<div class="login-box"><h3 style="color:var(--red)">'+d.error+'</h3><p style="font-size:11px;margin-top:4px;color:var(--tx3)">请确认密码正确或联系管理员</p></div>';return}
    build(d,db);
  }).catch(function(e){db.innerHTML='<div class="login-box"><h3 style="color:var(--red)">请求失败</h3><p style="font-size:12px;margin-top:8px;color:var(--tx3)">'+e.message+'</p></div>'})
}
function build(d,db){
  var h='',bk=d.breakdown||{},items=[{k:'credit_3',n:'体验包 4.9',p:4.9},{k:'credit_10',n:'进阶包 9.9',p:9.9},{k:'credit_20',n:'专业包 14.9',p:14.9},{k:'monthly',n:'月会员 29.9',p:29.9}];
  h+='<div class="stats-row"><div class="stat-card green"><div class="stat-label">累计订单</div><div class="stat-val">'+(d.totalOrders||0)+'</div></div><div class="stat-card gold"><div class="stat-label">总流水</div><div class="stat-val">'+((d.totalGMV||0).toFixed(2))+'</div></div><div class="stat-card gold"><div class="stat-label">应得分成</div><div class="stat-val">'+((d.totalCommission||0).toFixed(2))+'</div></div><div class="stat-card"><div class="stat-label">更新时间</div><div class="stat-val" style="font-size:18px">'+new Date().toLocaleTimeString()+'</div></div></div>';
  h+='<div class="breakdown">';
  items.forEach(function(i){var b=bk[i.k]||{};h+='<div class="break-card"><div class="b-name">'+i.n+'</div><div class="b-count">'+(b.count||0)+'单</div><div class="b-sub">'+b.rate+' | 小计 '+(b.subtotal||0).toFixed(2)+'</div></div>'});
  h+='</div>';
  h+='<div style="font-size:14px;color:var(--gold-l);letter-spacing:3px;margin-bottom:12px">订单明细</div><div style="overflow-x:auto"><table class="order-table"><thead><tr><th>时间</th><th>订单号</th><th>套餐</th><th>金额</th><th>分成</th><th>兑换码</th></tr></thead><tbody>';
  var orders=d.orders||[];
  if(orders.length){orders.forEach(function(o){h+='<tr><td>'+(o.date||'').slice(0,10)+'</td><td style="font-size:10px">'+(o.order_id||'').slice(0,20)+'</td><td>'+o.type+'</td><td>'+o.price+'</td><td style="color:var(--gold)">'+o.commission+'</td><td style="font-size:10px">'+(o.code||'').slice(0,12)+'</td></tr>'})}
  else{h+='<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--tx3)">暂无订单，用户购买后实时显示</td></tr>'}
  h+='</tbody></table></div>';
  db.innerHTML=h;
}
var p=new URLSearchParams(location.search);if(p.get('ch'))CH=p.get('ch');
</script></body></html>
