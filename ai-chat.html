<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="view-transition" content="same-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>知时先生 · AI 易学助手</title>
<meta name="description" content="知时先生，融合子平法与盲派体系的AI易学助手。">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/interactions.css">
<link rel="stylesheet" href="css/ink-wash.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--ink,#0e0c0a);color:var(--tx,#d8d0c0)}
.page{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:800px;margin:0 auto;position:relative}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd,rgba(180,160,140,.08));background:var(--ink);flex-shrink:0}
.topbar .back{color:var(--tx2);text-decoration:none;font-size:20px;padding:4px 8px}
.topbar .title{flex:1;font-size:18px;color:var(--gold-l);letter-spacing:3px;font-weight:700}
.topbar .mode-btn{padding:5px 14px;border-radius:14px;border:1px solid var(--bd2);background:none;color:var(--tx2);font-size:12px;cursor:pointer;letter-spacing:1px;font-family:inherit}
.topbar .mode-btn.pro{color:var(--gold-l);border-color:var(--gold);background:rgba(201,168,76,.08)}
.topbar .credits{font-size:13px;color:var(--tx2)}
.topbar .credits strong{color:var(--gold-l);font-size:16px}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.msg{display:flex;gap:10px;max-width:90%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.ai{align-self:flex-start}
.msg .avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.msg.user .avatar{background:rgba(80,160,200,.15);color:#64B5F6}
.msg.ai .avatar{background:rgba(201,168,76,.12);color:var(--gold-l)}
.msg .bubble{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.7;word-break:break-word}
.msg.user .bubble{background:rgba(80,160,200,.1);color:var(--tx);border-top-right-radius:4px}
.msg.ai .bubble{background:rgba(28,26,22,.8);border:1px solid rgba(180,160,140,.12);color:var(--tx);border-top-left-radius:4px}
.msg.ai .bubble strong{color:var(--gold-l)}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx3);gap:8px;padding:40px}
.empty-state .icon{font-size:48px;opacity:.5}
.empty-state h3{color:var(--gold-l);font-size:18px;letter-spacing:3px}
.empty-state p{font-size:13px;text-align:center;line-height:1.8}
.bottombar{flex-shrink:0;border-top:1px solid var(--bd);background:var(--ink);padding:8px 12px max(12px,env(safe-area-inset-bottom))}
.redeem-row{display:flex;gap:8px;margin-bottom:8px}
.redeem-row input{flex:1;padding:8px 12px;background:rgba(30,28,24,.6);border:1px solid rgba(200,190,170,.06);border-radius:10px;color:var(--tx);font-size:13px;font-family:monospace;letter-spacing:2px;text-align:center;outline:none}
.redeem-row input:focus{border-color:var(--gold)}
.redeem-row button{padding:8px 16px;border-radius:10px;border:1px solid var(--bd2);background:none;color:var(--gold-l);font-size:12px;cursor:pointer;letter-spacing:1px;white-space:nowrap}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-row textarea{flex:1;padding:10px 14px;background:rgba(30,28,24,.6);border:1px solid rgba(200,190,170,.06);border-radius:18px;color:var(--tx);font-size:14px;font-family:inherit;outline:none;resize:none;min-height:40px;max-height:100px;line-height:1.4}
.input-row textarea:focus{border-color:var(--gold)}
.input-row .send{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--ink);font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.input-row .send:disabled{opacity:.3}

/* 加载动画 */
.page-loader{position:fixed;inset:0;z-index:9998;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
.page-loader.hidden{opacity:0;pointer-events:none}
.hexa-reveal{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:20px}
.hexa-yao-yang{width:100px;height:8px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:4px;opacity:0;animation:hexaAppear .5s forwards}
.hexa-yao-yin{display:flex;gap:14px;opacity:0;animation:hexaAppear .5s forwards}
.hexa-yao-yin span{width:38px;height:8px;background:linear-gradient(90deg,transparent,rgba(180,180,200,.5),transparent);border-radius:4px}
@keyframes hexaAppear{from{opacity:0;transform:scale(.5);filter:blur(4px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
.hexa-name{font-size:24px;color:var(--gold-l);font-weight:900;letter-spacing:8px;opacity:0;animation:hexaAppear .5s 1.05s forwards}
.hexa-sub{font-size:11px;color:var(--tx3);letter-spacing:4px;opacity:0;animation:hexaAppear .5s 1.25s forwards;margin-top:4px}
body.loading .page{opacity:0}
body.loaded .page{opacity:1}

.eye-splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at center,#181612 0%,#0e0c0a 70%);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .5s}
.eye-ring{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid rgba(201,168,76,.08);animation:eyeRing 2s ease-out infinite}
@keyframes eyeRing{0%{transform:translate(-50%,-50%) scale(.8);opacity:.5}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
@media(max-width:600px){.page{max-width:100%}.topbar{padding:10px 12px;gap:8px}.topbar .title{font-size:15px;letter-spacing:1px}.topbar .mode-btn{padding:4px 10px;font-size:11px}.topbar .credits{font-size:11px}.messages{padding:10px;gap:8px}.msg{max-width:95%}.msg .bubble{padding:10px 12px;font-size:13px}.msg .avatar{width:30px;height:30px;font-size:12px}.bottombar{padding:6px 8px}.input-row textarea{font-size:13px;padding:8px 12px}.input-row .send{width:36px;height:36px;font-size:16px}.redeem-row input{font-size:12px;padding:6px 10px}.eye-splash svg{width:120px;height:72px}}
</style>
</head>
<body class="loading">

<div class="page-loader" id="pageLoader">
  <div class="hexa-reveal" id="hexaReveal"></div>
  <div class="hexa-name" id="hexaName"></div>
  <div class="hexa-sub" id="hexaSub"></div>
</div>

<div class="eye-splash" id="eyeSplash">
  <div class="eye-ring" style="width:260px;height:260px"></div>
  <div class="eye-ring" style="width:180px;height:180px;animation-delay:.4s"></div>
  <svg viewBox="0 0 100 60" style="width:160px;height:96px;position:relative;z-index:1">
    <defs><filter id="eyeGlow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <path d="M10,30 Q50,0 90,30 Q50,60 10,30Z" fill="none" stroke="#c9a84c" stroke-width="2" stroke-dasharray="150" stroke-dashoffset="150" filter="url(#eyeGlow)" id="eyePath"><animate attributeName="stroke-dashoffset" from="150" to="0" dur="1s" fill="freeze"/></path>
    <circle cx="50" cy="30" r="4" fill="#e8cf70" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".3s" begin=".8s" fill="freeze"/></circle>
    <circle cx="50" cy="30" r="10" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0"><animate attributeName="opacity" from=".6" to="0" dur=".6s" begin="1.1s" fill="freeze"/><animate attributeName="r" from="8" to="25" dur=".6s" begin="1.1s" fill="freeze"/></circle>
  </svg>
  <div style="color:#e8cf70;margin-top:16px;font-size:15px;letter-spacing:5px;position:relative;z-index:1">知 时 先 生</div>
</div>

<div class="page">
  <div class="topbar">
    <a href="javascript:history.back()" class="back">←</a>
    <span class="title">知时先生</span>
    <button class="mode-btn" id="modeBtn" onclick="toggleMode()">白话</button>
    <span class="credits" id="creditsLabel"></span>
  </div>
  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="icon" style="font-size:48px;color:rgba(201,168,76,.3);font-family:'STKaiti','KaiTi',serif">知</div>
      <h3>知时先生</h3>
      <p id="emptyDesc">首次体验免费，可提问 2 次<br>融合子平法与盲派体系</p>
    </div>
  </div>
  <div class="bottombar">
    <div class="redeem-row" id="redeemRow">
      <input type="text" id="redeemInput" placeholder="输入兑换码" maxlength="16">
      <button onclick="redeem()">激活</button>
    </div>
    <div class="input-row" id="inputRow">
      <textarea id="input" placeholder="输入你的问题..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button class="send" id="sendBtn" onclick="send()">▶</button>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
// 加载动画
(function(){
var G=['111111乾|元','000000坤|厚','010001屯|始','100010蒙|求','010111需|前','111010讼|成','000010师|律','010000比|辅','110111小畜|懿','111011履|虎','000111泰|交','111000否|往','111101同人|族','101111大有|顺','000100谦|裒','001000豫|乐','011001随|时','100110蛊|振','000011临|思','110000观|设','101001噬嗑|明','100101贲|明','000001剥|安','100000复|闭','111001无妄|佑','100111大畜|识','100001颐|饮','011110大过|立','010010坎|常','101101离|照','011100咸|通','001110恒|易','111100遁|远','001111大壮|履','101000晋|昭','000101明夷|晦','110101家人|言','101011睽|异','010100蹇|反','001010解|过','110001损|忿','100011益|善','011111夬|及','111110姤|诰','011000萃|除','000110升|大','011010困|志','010110井|相','101110革|时','011101鼎|位','001001震|省','100100艮|出','110100渐|善','001011归妹|敝','001101丰|刑','101100旅|刑','110110巽|命','011011兑|习','110010涣|帝','010011节|度','110011中孚|死','001100小过|过','010101既济|防','101010未济|居'];
var h=G[Math.floor(Math.random()*G.length)],b=h.split('|')[0].split(''),r=h.split('|');
var box=document.getElementById('hexaReveal'),delays=[800,650,500,350,200,80];
for(var i=0;i<6;i++){
  if(i<3&&(b[i]==='1'||!b[i])){var el=document.createElement('div');el.className='hexa-yao-yang';el.style.animationDelay=delays[i]+'ms';box.appendChild(el);}
  else if(i<3){var el=document.createElement('div');el.className='hexa-yao-yin';el.style.animationDelay=delays[i]+'ms';el.innerHTML='<span></span><span></span>';box.appendChild(el);}
}
document.getElementById('hexaName').textContent='知时先生';document.getElementById('hexaName').style.animationDelay='1050ms';
document.getElementById('hexaSub').textContent='—— AI易学助手';document.getElementById('hexaSub').style.animationDelay='1250ms';
setTimeout(function(){var l=document.getElementById('pageLoader');if(l)l.classList.add('hidden');document.body.classList.remove('loading');document.body.classList.add('loaded');var e=document.getElementById('eyeSplash');if(e){e.style.opacity='0';setTimeout(function(){e.remove()},600);}},1800);
})();

// 聊天功能
window._chatMode='plain';
function send(){var inp=document.getElementById('input');if(!inp||!inp.value.trim())return;var msg=inp.value.trim();inp.value='';addMsg('user',msg);callAI(msg);}
function toggleMode(){var btn=document.getElementById('modeBtn');window._chatMode=window._chatMode==='pro'?'plain':'pro';btn.textContent=window._chatMode==='pro'?'专业':'白话';btn.className='mode-btn'+(window._chatMode==='pro'?' pro':'');}
function redeem(){var inp=document.getElementById('redeemInput');if(!inp||!inp.value.trim())return;var code=inp.value.trim();var token=null;try{token=localStorage.getItem('ai_auth_token');}catch(e){}if(!token){alert('请先登录再激活兑换码');return;}fetch('/api/credits',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({code:code,action:'activate'})}).then(function(r){return r.json()}).then(function(d){if(d.success){try{localStorage.setItem('ai_auth_code',code);}catch(e){}alert('激活成功！会员已绑定到你的账号');inp.value='';updateCredits();}else{alert(d.error||'激活失败');}}).catch(function(){alert('网络错误');});}
function addMsg(role,text){var msgs=document.getElementById('messages');var empty=document.getElementById('emptyState');if(empty)empty.style.display='none';var div=document.createElement('div');div.className='msg '+role;div.innerHTML='<div class="avatar">'+(role==='user'?'你':'师')+'</div><div class="bubble">'+text.replace(/</g,'&lt;').replace(/\n/g,'<br>')+'</div>';msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;}
function updateCredits(){var el=document.getElementById('creditsLabel');if(!el)return;var token=null,code='';try{token=localStorage.getItem('ai_auth_token');code=localStorage.getItem('ai_auth_code')||localStorage.getItem('bazi_auth_code')||'';}catch(e){}if(!token&&!code){el.innerHTML='<a href="/profile" style="color:var(--gold-l);text-decoration:none;font-size:12px">登录</a>';return}if(!code){el.innerHTML='<a href="/pricing" style="color:var(--gold-l);text-decoration:none;font-size:11px">已登录</a>';return}el.textContent='加载中...';fetch('/api/credits?code='+encodeURIComponent(code)).then(function(r){return r.json()}).then(function(d){if(d.is_monthly||d.subscription_active){el.innerHTML='积分：<strong>∞会员</strong>';}else{el.innerHTML='积分：<strong>'+(d.credits||0)+'</strong>';}}).catch(function(){el.textContent='积分：?';});}
function callAI(msg){
  var msgs=document.getElementById('messages');var div=document.createElement('div');div.className='msg ai';div.id='aiTyping';div.innerHTML='<div class="avatar">师</div><div class="bubble">知时先生正在推演...</div>';msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
  var token=null,code='';try{token=localStorage.getItem('ai_auth_token');code=localStorage.getItem('ai_auth_code')||'';}catch(e){}
  var prompt='用户提问：'+msg+'\n\n请以"知时先生"身份回答。'+(window._chatMode==='pro'?'请使用专业命理术语。':'请用通俗易懂的白话。');
  var lrData=null;try{lrData=localStorage.getItem('ai_liuren_data');if(lrData)lrData=JSON.parse(lrData);}catch(e){}
  if(lrData&&lrData.type==='liuren'){prompt='以下是一份大六壬课式数据，请根据此课式进行专业断课解读：\n\n'+JSON.stringify({dateInfo:lrData.dateInfo,sanChuan:lrData.sanChuan,siKe:lrData.siKe,tianDiPan:lrData.tianDiPan,shenSha:lrData.shenSha},null,2)+'\n\n用户问题：'+(msg||'综合参详');}
  fetch('/api/divination',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(token||'')},body:JSON.stringify({prompt:prompt,divType:'liuren',code:code})})
  .then(function(r){return r.json()}).then(function(d){
    var typing=document.getElementById('aiTyping');if(typing)typing.remove();
    if(d.error){addMsg('ai','抱歉：'+d.error);return;}
    var text=d.reading||'';text=text.replace(/```json[\s\S]*?```/g,'').replace(/```[\s\S]*?```/g,'').trim();
    addMsg('ai',text||'卦象已显，请静心体悟。');
    updateCredits();
    try{localStorage.removeItem('ai_liuren_data');}catch(e){}
  }).catch(function(){var typing=document.getElementById('aiTyping');if(typing)typing.remove();addMsg('ai','网络连接失败，请稍后再试。');});
}
updateCredits();
// 大六壬跳转自动提示
(function(){var p=new URLSearchParams(location.search);if(p.get('t')==='lr'){var lr=null;try{lr=localStorage.getItem('ai_liuren_data');lr=lr?JSON.parse(lr):null;}catch(e){}if(lr){document.getElementById('emptyDesc').textContent='已加载六壬课式数据，输入问题即可开始解读';document.getElementById('input').placeholder='输入你的问题（或直接发送获取综合解读）...';}}})();
</script>
</body>
</html>
