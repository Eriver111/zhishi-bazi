<div id="eyeOverlay" style="position:fixed;inset:0;z-index:99999;background:radial-gradient(ellipse at center,#0d1525 0%,#080c14 70%);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .6s,visibility .6s">
<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;height:300px;border-radius:50%;border:1px solid rgba(201,168,76,.08);animation:eyeRing 3s ease-out infinite"></div>
<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:200px;border-radius:50%;border:1px solid rgba(201,168,76,.05);animation:eyeRing 3s ease-out .5s infinite"></div>
<style>@keyframes eyeRing{0%{transform:translate(-50%,-50%) scale(.8);opacity:.5}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}</style>
<div style="position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0" id="eyeParticles"></div><svg viewBox="0 0 100 60" style="width:120px;height:72px;position:relative;z-index:1">
<defs><filter id="eyeGlow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<path d="M10,30 Q50,0 90,30 Q50,60 10,30Z" fill="none" stroke="#c9a84c" stroke-width="2" stroke-dasharray="150" stroke-dashoffset="150" filter="url(#eyeGlow)"><animate attributeName="stroke-dashoffset" from="150" to="0" dur="1.2s" fill="freeze"/></path>
<circle cx="50" cy="30" r="4" fill="#e8cf70" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1s" fill="freeze"/><animate attributeName="r" from="3" to="7" dur="0.4s" begin="1s" fill="freeze"/></circle>
<circle cx="50" cy="30" r="10" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0"><animate attributeName="opacity" from="0.6" to="0" dur="0.8s" begin="1.3s" fill="freeze"/><animate attributeName="r" from="8" to="25" dur="0.8s" begin="1.3s" fill="freeze"/></circle>

<div style="color:#e8cf70;margin-top:16px;font-size:13px;letter-spacing:4px;position:relative;z-index:1">知 时 命 理</div>
<div style="color:rgba(180,160,140,.35);margin-top:8px;font-size:11px;letter-spacing:6px;position:relative;z-index:1">盲 派 · 天 眼 观 命</div>
</div>

<div class="bg-layer"><canvas id="bgCanvas"></canvas><div class="bg-overlay"></div></div>
<div class="ink-splash tl"></div>
<div class="ink-splash br"></div>

<div class="app">
  <header class="header">
    <div class="header-line"></div>
    <h1><a href="/">知 时</a></h1>
    <p class="tagline">知天时 · 见自己</p>
  </header>

  <div class="card">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="solar" onclick="switchMode('solar')">公历</button>
      <button class="mode-tab" data-mode="lunar" onclick="switchMode('lunar')">农历</button>
      <a href="hepan" style="margin-left:auto;color:var(--tx3);text-decoration:none;font-size:13px;letter-spacing:2px;padding:4px 12px;border-radius:20px;transition:all .25s" onmouseenter="this.style.color='var(--gold-l)';this.style.background='rgba(201,168,76,.06)'" onmouseleave="this.style.color='var(--tx3)';this.style.background='transparent'">合盘 ›</a>
    </div>

    <form id="birthForm" novalidate>
      <div class="mode-panel active" id="solarPanel">
        <div class="row two">
          <div class="field">
            <label>年份</label>
            <select id="sYear" required><option value="">选择年份</option></select>
          </div>
          <div class="field">
            <label>月份</label>
            <select id="sMonth" required><option value="">选择月份</option></select>
          </div>
        </div>
        <div class="row two">
          <div class="field">
            <label>日期</label>
            <select id="sDay" required><option value="">选择日期</option></select>
          </div>
          <div class="field">
            <label>出生时间</label>
            <div style="display:flex;gap:8px;align-items:center">
              <select id="sHour" required style="flex:1"><option value="">时辰</option></select>
              <span style="color:var(--tx3);font-size:12px">:</span>
              <select id="sMinute" style="flex:1"><option value="">分</option></select>
            </div>
            <span class="minute-hint">用于真太阳时校正，可不选</span>
          </div>
        </div>
      </div>

      <div class="mode-panel" id="lunarPanel">
        <div class="row two">
          <div class="field">
            <label>农历年份</label>
            <select id="lYear" required><option value="">选择年份</option></select>
          </div>
          <div class="field">
            <label>农历月份</label>
            <select id="lMonth" required><option value="">选择月份</option></select>
          </div>
        </div>
        <div class="row two">
          <div class="field">
            <label>农历日期</label>
            <select id="lDay" required><option value="">选择日期</option></select>
          </div>
          <div class="field">
            <label>时辰（精确到点）</label>
            <select id="lHour" required><option value="">选择时辰</option></select>
          </div>
          <div class="field">
            <label>精确分钟</label>
            <input type="number" id="lMinute" min="0" max="59" placeholder="如 30" class="minute-inp">
            <span class="minute-hint">用于真太阳时校正，可不填</span>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="field" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--tx2);cursor:pointer">
            <input type="checkbox" id="zishiHuanri" value="1" style="width:16px;height:16px">
            子时换日
          </label>
          <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--tx2);cursor:pointer">
            <input type="checkbox" id="solarEnabled" checked value="1" style="width:16px;height:16px">
            真太阳时
          </label>
          <span style="font-size:10px;color:var(--tx3)">默认：子时换日关 · 真太阳时开</span>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>性别</label>
          <div class="radio-group">
            <label class="radio"><input type="radio" name="gender" value="male" required> <span>乾造 · 男</span></label>
            <label class="radio"><input type="radio" name="gender" value="female"> <span>坤造 · 女</span></label>
          </div>
        </div>
      </div>

      <div class="row two">
        <div class="field">
          <label>出生地 · 省</label>
          <select id="province" required><option value="">选择省份</option></select>
        </div>
        <div class="field">
          <label>出生地 · 市</label>
          <select id="city" required disabled><option value="">选择城市</option></select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>出生地 · 区县</label>
          <select id="district" required disabled><option value="">选择区县</option></select>
        </div>
      </div>

      <button type="submit" class="submit">起盘推演</button>
    </form>

    <div class="trust">
      <span>🔒 全程加密</span>
      <span>☁️ 不留存数据</span>
      <span>⚡ 秒出结果</span>
    </div>
  </div>

  <footer class="footer">
    <p>知天时，见自己 · 仅供娱乐交流</p>
    <p class="disc">※ 本站内容仅供学习参考与娱乐交流，不构成任何决策建议</p>
  </footer>
</div>

<script>setTimeout(function(){var o=document.getElementById("eyeOverlay");if(o){o.style.opacity="0";o.style.visibility="hidden";setTimeout(function(){o.remove()},600)}},2500)</script>


<script>
(function(){
  var t=localStorage.getItem('ai_chat_type');
  if(t==='monthly'){
    var p=localStorage.getItem('last_bazi_params');
    if(p){
      var d=new URLSearchParams(p);
      // Auto-fill form
      setTimeout(function(){
        var sy=document.getElementById('sYear'),sm=document.getElementById('sMonth'),sd=document.getElementById('sDay'),sh=document.getElementById('sHour');
        if(sy&&d.get('year'))sy.value=d.get('year');
        if(sm&&d.get('month'))sm.value=d.get('month');
        if(sd&&d.get('day'))sd.value=d.get('day');
        if(sh&&d.get('hour'))sh.value=d.get('hour');
        var g=document.querySelector('input[name=gender][value='+(d.get('gender')||'male')+']');
        if(g)g.checked=true;
        // Show hint
        var c=document.querySelector('.card');
        if(c){var hint=document.createElement('div');hint.style.cssText='text-align:center;color:var(--gold);font-size:12px;margin-top:8px;padding:8px;background:rgba(201,168,76,.08);border-radius:8px';hint.textContent='👑 会员自动加载上次命盘';c.appendChild(hint)}
      },600);
    }
  }
})();
</script></body>
