<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知时 · 观面</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<style>
.face-wrap{max-width:640px;margin:0 auto;padding:60px 20px 80px;position:relative;z-index:1}
.face-hero{text-align:center;margin-bottom:36px}
.face-hero h1{font-size:36px;color:var(--gold-l);letter-spacing:10px;margin-bottom:4px;font-weight:900}
.face-hero .tagline{font-size:13px;color:var(--tx2);letter-spacing:4px}
.face-hero .tagline span{color:var(--gold);font-weight:600}

.face-card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 24px;backdrop-filter:blur(20px)}
.face-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.3}

.upload-area{position:relative;margin-bottom:20px}
.upload-zone{
  width:100%;aspect-ratio:1;max-height:360px;border:2px dashed rgba(201,168,76,.2);
  border-radius:14px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .35s;overflow:hidden;position:relative;
  background:linear-gradient(135deg,rgba(201,168,76,.02),rgba(201,168,76,0));
}
.upload-zone:hover{border-color:var(--gold);background:rgba(201,168,76,.04);box-shadow:0 0 40px rgba(201,168,76,.06)}
.upload-zone.has-image{border-style:solid;border-color:rgba(201,168,76,.15)}
.upload-zone img{width:100%;height:100%;object-fit:cover}
.upload-placeholder{text-align:center;color:var(--tx3);pointer-events:none}
.upload-placeholder .icon{font-size:44px;display:block;margin-bottom:10px;opacity:.6}
.upload-placeholder .main-hint{font-size:14px;color:var(--tx2);letter-spacing:2px;margin-bottom:6px}
.upload-placeholder .sub-hint{font-size:11px;color:var(--tx3);line-height:1.8}

.tips-box{
  margin-bottom:20px;padding:16px 18px;background:rgba(201,168,76,.03);
  border:1px solid rgba(201,168,76,.1);border-radius:10px
}
.tips-title{font-size:11px;color:var(--gold);letter-spacing:3px;margin-bottom:10px}
.tips-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--tx2)}
.tips-grid div{padding:6px 8px;background:rgba(0,0,0,.1);border-radius:6px;letter-spacing:1px}
.tips-grid .good{color:#81C784}
.tips-grid .warn{color:#E57373}

.credit-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:12px}
.credit-tag{padding:4px 12px;border:1px solid rgba(201,168,76,.2);border-radius:20px;color:var(--gold-l);letter-spacing:1px}

.btn-face{
  width:100%;padding:14px;border-radius:28px;font-size:15px;font-weight:700;
  letter-spacing:4px;cursor:pointer;font-family:inherit;transition:all .3s;border:none;
  background:linear-gradient(135deg,var(--gold-d),var(--gold),var(--gold-l));
  background-size:200% 100%;color:var(--ink);animation:shimmer 3s infinite
}
.btn-face:disabled{opacity:.4;cursor:not-allowed;animation:none}
.btn-face:not(:disabled):hover{box-shadow:0 6px 28px rgba(201,168,76,.25);transform:translateY(-1px)}

.result-card{display:none;margin-top:20px;padding:24px;background:var(--card);border:1px solid var(--bd);border-radius:14px;line-height:2.1;font-size:14px;color:var(--tx)}
.result-card h3{text-align:center;font-size:18px;color:var(--gold-l);letter-spacing:4px;margin-bottom:18px}
.result-card .poem{text-align:center;color:var(--gold);font-size:15px;letter-spacing:2px;margin:16px 0;padding:12px;background:rgba(201,168,76,.04);border-radius:8px;font-style:italic}

.loading-state{display:none;text-align:center;padding:36px 0}
.loading-dots span{display:inline-block;width:7px;height:7px;margin:0 3px;background:var(--gold);border-radius:50%;animation:dotBounce 1.4s infinite ease-in-out}
.loading-dots span:nth-child(2){animation-delay:.16s}
.loading-dots span:nth-child(3){animation-delay:.32s}
@keyframes dotBounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.loading-text{margin-top:10px;font-size:13px;color:var(--tx3);letter-spacing:2px}

.error-msg{display:none;margin-top:12px;padding:10px 14px;background:rgba(244,67,54,.06);border:1px solid rgba(244,67,54,.15);border-radius:8px;color:#E57373;font-size:12px;text-align:center}

/* === 逐宫扫光动画 === */
.scan-overlay{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.scan-overlay{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.scan-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:rgba(232,207,112,.9);box-shadow:0 0 18px 6px rgba(232,207,112,.6),0 0 36px 12px rgba(201,168,76,.3);transform:translate(-50%,-50%) scale(0);opacity:0;transition:all .3s ease-out}
.scan-dot.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.scan-dot.glow{animation:dotGlow .7s ease-out forwards}
@keyframes dotGlow{0%{transform:translate(-50%,-50%) scale(1);opacity:1;box-shadow:0 0 28px 10px rgba(232,207,112,.8)}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0;box-shadow:0 0 60px 20px rgba(232,207,112,0)}}
.scan-label{position:absolute;font-size:11px;color:var(--gold-l);letter-spacing:2px;transform:translate(-50%,-100%);opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;text-shadow:0 0 8px rgba(0,0,0,.8)}
.scan-label.show{opacity:1}

.scroll-reveal{display:none;position:relative;margin-top:20px;overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.scroll-reveal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.4;z-index:3}
.scroll-left,.scroll-right{position:absolute;top:0;width:14px;height:100%;background:linear-gradient(180deg,rgba(201,168,76,.12),rgba(139,109,40,.2),rgba(201,168,76,.12));z-index:2}
.scroll-left{left:0;border-right:1px solid rgba(201,168,76,.15)}
.scroll-right{right:0;border-left:1px solid rgba(201,168,76,.15)}
.scroll-body{overflow:hidden;max-height:0;transition:max-height 1s cubic-bezier(.4,0,.2,1);position:relative;z-index:1}
.scroll-body.open{max-height:6000px}
.scroll-body-inner{padding:24px 20px;opacity:0;transform:translateY(12px);transition:all .6s .3s;line-height:2.1;font-size:14px;color:var(--tx)}
.scroll-body.open .scroll-body-inner{opacity:1;transform:translateY(0)}
.scroll-hint{text-align:center;padding:14px;color:var(--gold);font-size:12px;letter-spacing:3px}

@media(max-width:400px){
  .face-wrap{padding:40px 10px 60px}
  .face-hero h1{font-size:28px;letter-spacing:8px}
  .tips-grid{grid-template-columns:1fr}
  .face-card{padding:20px 16px}
}
</style>
<link rel="stylesheet" href="css/theme-light.css?v=4">
<link rel="stylesheet" href="css/theme-light-forms.css?v=1">
<link rel="stylesheet" href="css/theme-light-pages.css?v=1">
</head>
<body>
<canvas id="bgCanvas" style="position:fixed;inset:0;z-index:0;width:100%;height:100%"></canvas>
<div id="zhishi-nav" style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(28,26,22,.92);border-bottom:1px solid rgba(201,168,76,.1);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px"><a href="/" style="font-size:18px;font-weight:900;letter-spacing:4px;color:#e8cf70;text-decoration:none;margin-right:8px">知时</a><div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap"><a href="/paipan" style="color:#a09888;text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap">八字排盘</a><a href="/ziwei" style="color:#a09888;text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap">紫微斗数</a><a href="/fengshui" style="color:#a09888;text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap">风水</a><a href="/face" style="color:#e8cf70;text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap">观面</a><a href="/palm" style="color:#a09888;text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap">观手</a><div style="position:relative;display:inline-block" onmouseenter="this.querySelector('.dd-menu').style.display='block'" onmouseleave="this.querySelector('.dd-menu').style.display='none'"><span onclick="var m=this.nextElementSibling;m.style.display=m.style.display=='block'?'none':'block'" style="color:#a09888;cursor:pointer;padding:6px 10px;border-radius:6px;white-space:nowrap;user-select:none">更多 ▾</span><div class="dd-menu" style="display:none;position:absolute;top:100%;left:0;background:rgba(28,26,22,.96);border:1px solid rgba(201,168,76,.15);border-radius:8px;padding:4px 0;min-width:120px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.6)"><a href="/hepan" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap" onmouseenter="this.style.background='rgba(201,168,76,.06)';this.style.color='#e8cf70'" onmouseleave="this.style.background='transparent';this.style.color='#a09888'">合盘缘分</a><a href="/fortune" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap" onmouseenter="this.style.background='rgba(201,168,76,.06)';this.style.color='#e8cf70'" onmouseleave="this.style.background='transparent';this.style.color='#a09888'">今日运势</a><a href="/meihua" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap" onmouseenter="this.style.background='rgba(201,168,76,.06)';this.style.color='#e8cf70'" onmouseleave="this.style.background='transparent';this.style.color='#a09888'">梅花易数</a><a href="/liuyao" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap" onmouseenter="this.style.background='rgba(201,168,76,.06)';this.style.color='#e8cf70'" onmouseleave="this.style.background='transparent';this.style.color='#a09888'">六爻占卜</a><a href="/liuren" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap" onmouseenter="this.style.background='rgba(201,168,76,.06)';this.style.color='#e8cf70'" onmouseleave="this.style.background='transparent';this.style.color='#a09888'">大六壬</a><a href="/profile" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">个人中心</a></div></div><a href="/pricing" style="color:#c9a84c;text-decoration:none;padding:6px 10px;border-radius:6px;border:1px solid rgba(201,168,76,.25);white-space:nowrap">积分</a><span id="nav-user-area" class="nav-user" style="margin-left:4px;font-size:12px"></span></div></div>

<div class="face-wrap">
  <div class="face-hero">
    <h1>观 面</h1>
    <div class="tagline"><span>《麻衣神相》</span> · 十二宫精解 · AI 参详</div>
  </div>

  <div class="face-card">
    <div class="credit-bar">
      <span style="color:var(--tx3)">单次消耗 <b style="color:var(--gold)">1</b> 积分</span>
      <span class="credit-tag" id="creditTag">-- 次剩余</span>
    </div>

    <div class="tips-box">
      <div class="tips-title">拍摄建议</div>
      <div class="tips-grid">
        <div class="good">☀️ 正对自然光源，光线均匀</div>
        <div class="good">👤 露出额头，勿用刘海遮挡</div>
        <div class="good">📷 平视镜头，面部居中清晰</div>
        <div class="warn">⚠️ 避免顶部强光或逆光拍摄</div>
        <div class="warn">⚠️ 勿戴帽子、墨镜等遮挡物</div>
        <div class="warn">⚠️ 美颜滤镜会影响判断准确度</div>
      </div>
    </div>

    <div class="upload-area">
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-placeholder" id="placeholder">
          <span class="icon">📷</span>
          <div class="main-hint">点击上传正面照片</div>
          <div class="sub-hint">五官清晰、额头可见为佳</div>
        </div>
        <img id="preview" style="display:none">
      </div>
    </div>

    <button class="btn-face" id="btnAnalyze" onclick="startAnalysis()" style="display:none">开 始 观 面</button>

    <div class="loading-state" id="loading">
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <div class="loading-text" id="loadingText" style="font-size:16px;font-weight:700;letter-spacing:2px">🔍 AI 正在读取面部特征...</div>
      <div style="margin:14px 0;height:8px;background:rgba(201,168,76,.12);border-radius:4px;overflow:hidden;max-width:300px;margin-left:auto;margin-right:auto;box-shadow:inset 0 0 4px rgba(0,0,0,.3)"><div id="loadingBar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--gold-d),var(--gold),var(--gold-l));border-radius:4px;transition:width .4s;box-shadow:0 0 8px rgba(201,168,76,.3)"></div></div>
      <div style="margin-top:6px;font-size:13px;color:var(--gold);font-weight:600;letter-spacing:2px" id="loadingSub">⏳ 图片分析中，约需 30-60 秒，请勿离开页面</div>
    </div>

    <div class="error-msg" id="error"></div>
  </div>

  <div class="result-card" id="result"></div>
</div>

<script src="js/bg-animation.js"></script>
<script src="js/auth.js?v=5"></script>
<script>
var _imageData = null;

(function(){
  if(typeof Auth!=='undefined') Auth.ready(function(){
    if(!Auth.isLoggedIn()){ Auth.showModal('login'); return; }
    updateCreditsUI();
  });
  document.getElementById('fileInput').addEventListener('change', handleFile);
})();

function handleFile(e){
  var file=e.target.files[0];
  if(!file) return;
  if(file.size>5*1024*1024){showError('图片过大，请选择5MB以下的照片');return;}

  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var maxW=800,maxH=800;
      var w=img.width,h=img.height;
      if(w>maxW||h>maxH){var r=Math.min(maxW/w,maxH/h);w*=r;h*=r}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      _imageData=canvas.toDataURL('image/jpeg',0.6);
      document.getElementById('preview').src=_imageData;
      document.getElementById('preview').style.display='block';
      document.getElementById('placeholder').style.display='none';
      document.getElementById('uploadZone').classList.add('has-image');
      document.getElementById('btnAnalyze').style.display='block';
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

// === 十二宫扫光位置 ===
var PALACE_POS=[{name:'命宫',x:50,y:33},{name:'财帛',x:50,y:54},{name:'兄弟',x:42,y:30},{name:'田宅',x:55,y:38},{name:'男女',x:50,y:44},{name:'妻妾',x:70,y:34},{name:'疾厄',x:50,y:40},{name:'迁移',x:40,y:28},{name:'官禄',x:50,y:20},{name:'福德',x:65,y:30},{name:'奴仆',x:50,y:62},{name:'相貌',x:50,y:50}];
function buildScanOverlay(){
  var zone=document.getElementById('uploadZone');
  var overlay=document.getElementById('scanOverlay');
  if(!overlay){overlay=document.createElement('div');overlay.id='scanOverlay';overlay.className='scan-overlay';zone.appendChild(overlay)}
  overlay.innerHTML='';overlay.style.display='block';
}
function runScanPhase(){
  return new Promise(function(resolve){
    buildScanOverlay();
    document.getElementById('btnAnalyze').style.display='none';
    var overlay=document.getElementById('scanOverlay');
    var names=['命宫','财帛','兄弟','田宅','男女','妻妾','疾厄','迁移','官禄','福德','奴仆','相貌'];
    var pos=PALACE_POS;
    var current=-1;
    function next(){
      current++;
      if(current>=pos.length){setTimeout(function(){overlay.style.display='none';resolve()},500);return}
      var dot=document.createElement('div');dot.className='scan-dot';dot.style.left=pos[current].x+'%';dot.style.top=pos[current].y+'%';overlay.appendChild(dot);
      var label=document.createElement('div');label.className='scan-label';label.style.left=pos[current].x+'%';label.style.top=pos[current].y+'%';label.textContent=names[current]+'宫';overlay.appendChild(label);
      requestAnimationFrame(function(){
        dot.classList.add('show');label.classList.add('show');
        setTimeout(function(){dot.classList.add('glow');label.classList.remove('show')},500);
        setTimeout(function(){dot.remove();label.remove();next()},750);
      });
    }
    next();
  });
}function runScrollReveal(resultHTML){
  return new Promise(function(resolve){
    var scroll=document.getElementById('scrollReveal');
    if(!scroll){scroll=document.createElement('div');scroll.id='scrollReveal';scroll.className='scroll-reveal';scroll.innerHTML='<div class=scroll-left></div><div class=scroll-right></div><div class=scroll-body id=scrollBody><div class=scroll-body-inner id=scrollInner></div></div>';var fc=document.querySelector('.face-card');fc.parentNode.insertBefore(scroll,fc.nextSibling)}
    scroll.style.display='block';var body=document.getElementById('scrollBody');body.classList.remove('open');document.getElementById('scrollInner').innerHTML=resultHTML;
    setTimeout(function(){body.classList.add('open');setTimeout(resolve,1400)},200);
  });
}
function startAnalysis(){
  if(!_imageData) return;
  if(typeof Auth==='undefined'||!Auth.isLoggedIn()){Auth.showModal('login');return}
  var btn=document.getElementById('btnAnalyze');btn.disabled=true;btn.textContent='观面中...';
  document.getElementById('loading').style.display='block';
  // 轮换提示词
  var tips=['正在定位命宫与财帛宫...','分析面部骨相与皮相...','参详五官气色与光泽...','《麻衣神相》对照十二宫...','综合判断各宫吉凶...','生成面相分析报告...'];
  var tipIdx=0;var tipTimer=setInterval(function(){tipIdx=(tipIdx+1)%tips.length;var el=document.getElementById('loadingText');if(el)el.textContent=tips[tipIdx]},5000);
  // 进度条动画
  var bar=document.getElementById('loadingBar');var barPct=0;var barTimer=setInterval(function(){barPct+=Math.random()*8+2;if(barPct>90)barPct=90;if(bar)bar.style.width=barPct+'%'},2000);
  document.getElementById('result').style.display='none';document.getElementById('error').style.display='none';
  var scrollEl=document.getElementById('scrollReveal');if(scrollEl)scrollEl.style.display='none';
  var apiP=fetch('/api/face-reading',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+Auth.getToken()},body:JSON.stringify({image:_imageData})}).then(function(r){return r.json()});
  var scanP=runScanPhase();
  Promise.all([scanP,apiP]).then(function(rr){clearInterval(tipTimer);clearInterval(barTimer);var bar=document.getElementById('loadingBar');if(bar)bar.style.width='100%';var d=rr[1];if(d.error){showError(d.error);btn.disabled=false;btn.textContent='开始观面';return}
    var html='<div class=scroll-hint>—— 观面结果 ——</div>'+d.reading.replace(/\n/g,'<br>');
    runScrollReveal(html).then(function(){btn.disabled=false;btn.textContent='重新观面';updateCreditsUI()});
  }).catch(function(){clearInterval(tipTimer);clearInterval(barTimer);btn.disabled=false;btn.textContent='开始观面';showError('网络错误')});
}

function updateCreditsUI(){
  if(typeof Auth==='undefined'||!Auth.isLoggedIn()) return;
  fetch('/api/auth/profile',{headers:{'Authorization':'Bearer '+Auth.getToken()}})
  .then(function(r){return r.json()})
  .then(function(d){
    var tag=document.getElementById('creditTag');
    if(d.is_monthly){tag.textContent='月会员 · 不限次';}
    else{tag.textContent=(d.credits||0)+' 次剩余';}
  }).catch(function(){});
}

function showError(msg){
  var el=document.getElementById('error');
  el.style.display='block';el.textContent=msg;
}
</script>
</body>
</html>
