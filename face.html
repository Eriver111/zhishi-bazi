<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知时 · AI 面相分析</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<style>
.face-page{max-width:600px;margin:60px auto 40px;padding:0 20px;text-align:center}
.face-page h1{font-size:24px;color:var(--gold-l);letter-spacing:6px;margin-bottom:4px}
.face-page .sub{font-size:12px;color:var(--tx3);margin-bottom:24px;letter-spacing:2px}
.upload-zone{
  width:280px;height:280px;margin:0 auto 20px;border:2px dashed rgba(201,168,76,.25);
  border-radius:16px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .3s;overflow:hidden;position:relative;
  background:rgba(201,168,76,.02);
}
.upload-zone:hover{border-color:rgba(201,168,76,.5);background:rgba(201,168,76,.06)}
.upload-zone img{width:100%;height:100%;object-fit:cover}
.upload-hint{color:var(--tx3);font-size:13px;line-height:1.8}
.upload-hint .icon{font-size:40px;display:block;margin-bottom:8px}
#result{display:none;text-align:left;margin-top:20px;padding:20px;background:var(--card);border:1px solid var(--bd);border-radius:12px;line-height:2;font-size:14px;color:var(--tx)}
#result h3{text-align:center;color:var(--gold-l);margin-bottom:16px;letter-spacing:3px}
.credits-tag{display:inline-block;padding:4px 12px;border:1px solid rgba(201,168,76,.2);border-radius:20px;font-size:12px;color:var(--gold-l);margin-bottom:16px}
.btn-analyze{
  display:none;margin:16px auto;padding:14px 40px;background:linear-gradient(135deg,var(--gold-d),var(--gold));
  color:var(--ink);border:none;border-radius:25px;font-size:15px;font-weight:700;letter-spacing:3px;cursor:pointer;font-family:inherit
}
.btn-analyze:disabled{opacity:.5;cursor:not-allowed}
.loading-dots{text-align:center;padding:40px}
.loading-dots span{display:inline-block;width:8px;height:8px;margin:0 3px;background:var(--gold);border-radius:50%;animation:dotBounce 1.4s infinite ease-in-out}
.loading-dots span:nth-child(2){animation-delay:.16s}
.loading-dots span:nth-child(3){animation-delay:.32s}
@keyframes dotBounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
@media(max-width:400px){.face-page{padding:0 12px;margin-top:40px}.upload-zone{width:240px;height:240px}}
</style>
</head>
<body>
<div id="zhishi-nav"></div>

<div class="face-page">
  <h1>AI 面相</h1>
  <div class="sub">《麻衣神相》· 十二宫精解</div>

  <div class="credits-tag" id="creditTag">-- 次剩余</div>

  <input type="file" id="fileInput" accept="image/*" capture="user" style="display:none">
  <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
    <div class="upload-hint" id="uploadHint">
      <span class="icon">📷</span>
      点击上传正面照片<br>（光线充足、无遮挡为佳）
    </div>
    <img id="preview" style="display:none">
  </div>

  <button class="btn-analyze" id="btnAnalyze" onclick="startAnalysis()">开始面相分析</button>

  <div id="loading" style="display:none">
    <div class="loading-dots"><span></span><span></span><span></span></div>
    <div style="color:var(--tx3);font-size:13px">AI 正在逐宫分析中...</div>
  </div>

  <div id="result"></div>
  <div id="error" style="display:none;color:#E57373;font-size:13px;margin-top:12px"></div>
</div>

<script src="js/auth.js"></script>
<script>
var _imageData = null;

// Init
(function(){
  if(typeof Auth!=='undefined') Auth.ready(function(){
    if(!Auth.isLoggedIn()){ Auth.showModal('login'); return; }
    updateCreditsUI();
  });
  document.getElementById('fileInput').addEventListener('change', handleFile);
})();

function handleFile(e){
  var file=e.target.files[0];
  if(!file) return;
  if(file.size>5*1024*1024){showError('图片过大，请选择5MB以下的照片');return;}

  var reader=new FileReader();
  reader.onload=function(ev){
    // 压缩图片
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var maxW=800,maxH=800;
      var w=img.width,h=img.height;
      if(w>maxW||h>maxH){
        var ratio=Math.min(maxW/w,maxH/h);
        w*=ratio;h*=ratio;
      }
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      _imageData=canvas.toDataURL('image/jpeg',0.8);
      document.getElementById('preview').src=_imageData;
      document.getElementById('preview').style.display='block';
      document.getElementById('uploadHint').style.display='none';
      document.getElementById('btnAnalyze').style.display='inline-block';
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function startAnalysis(){
  if(!_imageData) return;
  if(typeof Auth==='undefined'||!Auth.isLoggedIn()){ Auth.showModal('login'); return; }

  var btn=document.getElementById('btnAnalyze');
  btn.disabled=true;btn.textContent='分析中...';
  document.getElementById('loading').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('error').style.display='none';

  fetch('/api/face-reading',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+Auth.getToken()},
    body:JSON.stringify({image:_imageData})
  })
  .then(function(r){return r.json()})
  .then(function(d){
    document.getElementById('loading').style.display='none';
    btn.disabled=false;btn.textContent='重新分析';
    if(d.error){showError(d.error);return;}
    document.getElementById('result').style.display='block';
    document.getElementById('result').innerHTML='<h3>面相分析结果</h3>'+d.reading.replace(/\n/g,'<br>');
    updateCreditsUI();
  })
  .catch(function(e){
    document.getElementById('loading').style.display='none';
    btn.disabled=false;btn.textContent='开始面相分析';
    showError('网络错误，请重试');
  });
}

function updateCreditsUI(){
  if(typeof Auth==='undefined'||!Auth.isLoggedIn()) return;
  fetch('/api/auth/profile',{headers:{'Authorization':'Bearer '+Auth.getToken()}})
  .then(function(r){return r.json()})
  .then(function(d){
    var tag=document.getElementById('creditTag');
    if(d.is_monthly){tag.textContent='月度会员 · 不限次';}
    else{tag.textContent=(d.credits||0)+' 次剩余';}
  }).catch(function(){});
}

function showError(msg){
  var el=document.getElementById('error');
  el.style.display='block';el.textContent=msg;
}
</script>
</body>
</html>
