<style>
.meihua-page{max-width:600px;margin:80px auto 40px;padding:0 20px;animation:fadeIn .8s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.page-title{text-align:center;font-size:24px;color:var(--gold-l);letter-spacing:6px;margin-bottom:6px}
.page-sub{text-align:center;font-size:12px;color:var(--tx3);margin-bottom:32px;letter-spacing:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.2),transparent)}
.card h3{font-size:14px;color:var(--gold-l);letter-spacing:3px;margin-bottom:16px;text-align:center}
.num-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.num-row input{width:70px;padding:14px 8px;text-align:center;font-size:20px;font-weight:700;background:rgba(30,28,24,.6);border:1px solid rgba(201,168,76,.15);border-radius:10px;color:var(--gold-l);font-family:inherit;outline:none}
.num-row input:focus{border-color:var(--gold);box-shadow:0 0 20px rgba(201,168,76,.1)}
.num-row .num-label{font-size:10px;color:var(--tx3);text-align:center}
.btn-submit{display:block;margin:20px auto 0;padding:14px 40px;font-size:16px;font-weight:700;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--ink);border:none;border-radius:25px;cursor:pointer;letter-spacing:2px;font-family:inherit}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 4px 24px rgba(201,168,76,.2)}
.btn-random{display:block;margin:8px auto 0;padding:8px 20px;font-size:12px;background:transparent;border:1px solid var(--bd2);color:var(--tx2);border-radius:20px;cursor:pointer;font-family:inherit;letter-spacing:1px}
.hexagram{text-align:center;padding:20px 0}
.hexagram .gua-name{font-size:28px;color:var(--gold-l);font-weight:900;letter-spacing:6px;margin-bottom:4px}
.hexagram .gua-yao{font-size:24px;color:var(--tx2);font-family:monospace;line-height:1.8;margin:8px 0}
.hexagram .gua-desc{font-size:12px;color:var(--tx3);line-height:1.8}
.hexagram .arrow{font-size:28px;color:var(--gold);margin:10px 0}
.result{font-size:14px;color:var(--tx);line-height:2.2;padding:8px 0}
.loading{text-align:center;padding:40px;color:var(--tx3)}
.loading .spinner{display:inline-block;width:28px;height:28px;border:2px solid rgba(201,168,76,.1);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 全屏卦象特效 */
.gua-reveal{position:fixed;inset:0;z-index:9999;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fadeIn .3s}
.gua-reveal.fadeOut{animation:fadeOut .8s forwards}
@keyframes fadeOut{to{opacity:0;pointer-events:none}}
.gua-reveal .reveal-yao{font-size:36px;opacity:0;animation:revealLine .5s forwards}
@keyframes revealLine{from{opacity:0;transform:scale(.5);filter:blur(8px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
.gua-reveal .reveal-yao:nth-child(1){animation-delay:.1s}
.gua-reveal .reveal-yao:nth-child(2){animation-delay:.3s}
.gua-reveal .reveal-yao:nth-child(3){animation-delay:.5s}
.gua-reveal .reveal-yao:nth-child(4){animation-delay:.7s}
.gua-reveal .reveal-yao:nth-child(5){animation-delay:.9s}
.gua-reveal .reveal-yao:nth-child(6){animation-delay:1.1s}
.gua-reveal .reveal-name{font-size:32px;color:var(--gold-l);font-weight:900;letter-spacing:8px;opacity:0;animation:revealLine .5s 1.4s forwards;margin-top:16px}
.gua-reveal .reveal-sub{font-size:12px;color:var(--tx3);letter-spacing:4px;opacity:0;animation:revealLine .5s 1.7s forwards;margin-top:8px}
@media(max-width:768px){.meihua-page{margin:60px auto 30px;padding:0 12px}.page-title{font-size:20px}.page-sub{font-size:11px;margin-bottom:20px}.card{padding:18px 14px;margin-bottom:12px}.num-row{gap:8px}.num-row input{width:56px;padding:12px 6px;font-size:17px}.btn-submit{padding:12px 30px;font-size:15px}.hexagram .gua-name{font-size:22px}.hexagram .gua-yao{font-size:18px}.gua-reveal .reveal-yao{font-size:26px}.gua-reveal .reveal-name{font-size:24px;letter-spacing:4px}}
@media(max-width:400px){.meihua-page{padding:0 8px}.card{padding:14px 10px}.num-row input{width:50px;padding:10px 4px;font-size:15px}.btn-submit{width:100%}.result{font-size:13px}}
</style>

</head>
<body>
<div id="zhishi-nav" style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(28,26,22,.92);border-bottom:1px solid rgba(201,168,76,.1);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px"><a href="/" style="font-size:18px;font-weight:900;letter-spacing:4px;color:#e8cf70;text-decoration:none;margin-right:8px">知时</a><div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap"><a href="/paipan" style="color:#a09888;text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap">八字排盘</a><a href="/ziwei" style="color:#a09888;text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap">紫微斗数</a><a href="/fengshui" style="color:#a09888;text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap">风水</a><div style="position:relative;display:inline-block" onmouseenter="this.querySelector('.dd-menu').style.display='block'" onmouseleave="this.querySelector('.dd-menu').style.display='none'"><span onclick="var m=this.nextElementSibling;m.style.display=m.style.display=='block'?'none':'block'" style="color:#a09888;cursor:pointer;padding:6px 10px;border-radius:6px;white-space:nowrap;user-select:none">更多 ▾</span><div class="dd-menu" style="display:none;position:absolute;top:100%;left:0;background:rgba(28,26,22,.96);border:1px solid rgba(201,168,76,.15);border-radius:8px;padding:4px 0;min-width:120px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.6)"><a href="/hepan" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">合盘缘分</a><a href="/face" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">观面</a><a href="/palm" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">观手</a><a href="/fortune" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">今日运势</a><a href="/meihua" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">梅花易数</a><a href="/liuyao" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">六爻占卜</a><a href="/liuren" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">大六壬</a><a href="/profile" style="display:block;color:#a09888;text-decoration:none;padding:8px 16px;white-space:nowrap">个人中心</a></div></div><a href="/pricing" style="color:#c9a84c;text-decoration:none;padding:6px 10px;border-radius:6px;border:1px solid rgba(201,168,76,.25);white-space:nowrap">积分</a><span id="nav-user-area" class="nav-user" style="margin-left:4px;font-size:12px"></span></div></div>
<div class="meihua-page">
  <div class="page-title">梅花易数</div>
  <div class="page-sub">以数起卦 · AI 解卦 · 问事占卜</div>

  <div class="card">
    <h3>心中默念所问之事，输入数字起卦</h3>
    <div style="margin-bottom:12px">
      <input type="text" id="question" placeholder="你想问什么？（如：这份工作能成吗）" style="width:100%;padding:12px 16px;font-size:14px;font-family:inherit;background:rgba(30,28,24,.6);border:1px solid rgba(201,168,76,.15);border-radius:10px;color:var(--tx);outline:none">
    </div>
    <div class="num-row">
      <div><div class="num-label">上卦数</div><input type="number" id="n1" min="1" max="99" value="" placeholder="1-99"></div>
      <div><div class="num-label">下卦数</div><input type="number" id="n2" min="1" max="99" value="" placeholder="1-99"></div>
      <div><div class="num-label">动爻数</div><input type="number" id="n3" min="1" max="99" value="" placeholder="1-99"></div>
    </div>
    <button class="btn-submit" onclick="doGua()">起卦解卦</button>
    <button class="btn-random" onclick="randomGua()">随机起卦</button>
  </div>

  <div id="result"></div>
</div>

<script src="js/yijing-db.js"></script>
<script src="js/auth.js?v=5"></script>
<script>
var TG=['乾','兑','离','震','巽','坎','艮','坤'];
var TG_IMAGE=['天','泽','火','雷','风','水','山','地'];
var TG_WX=['金','金','火','木','木','水','土','土'];
// 爻象统一按“从上到下”保存；动爻仍按易学惯例从初爻（最下）向上数。
var TG_LINES={乾:'111',兑:'011',离:'101',震:'001',巽:'110',坎:'010',艮:'100',坤:'000'};
var LINES_TG={};Object.keys(TG_LINES).forEach(function(k){LINES_TG[TG_LINES[k]]=k;});

function yaoStr(y){ return y.map(function(v){ return v===1?'━━━':'━ ━'; }).join('<br>'); }
function findGua(name){ return YIJING.find(function(g){ return g.name===name; }); }

function getGua(n1,n2,n3){
  var up=n1%8||8, dn=n2%8||8, mv=n3%6||6;
  var upName=TG[up-1],dnName=TG[dn-1];
  var upBin=TG_LINES[upName],dnBin=TG_LINES[dnName];
  var origBin=upBin+dnBin;
  var gName=upName+'为'+dnName;
  var found=YIJING.find(function(g){ return g.upper===upName&&g.lower===dnName; });
  if(found) gName=found.name;
  var yao=upBin.split('').map(Number).concat(dnBin.split('').map(Number));
  var chgBin=origBin.split('');var movingIndex=6-mv;chgBin[movingIndex]=chgBin[movingIndex]==='1'?'0':'1';chgBin=chgBin.join('');
  var chgUp=LINES_TG[chgBin.slice(0,3)],chgDn=LINES_TG[chgBin.slice(3,6)];
  var chgFound=YIJING.find(function(g){return g.upper===chgUp&&g.lower===chgDn;});
  var chgName=chgFound?chgFound.name:(chgUp+'为'+chgDn);
  // 互卦：二三四爻为下互，三四五爻为上互。
  var bottomUp=origBin.split('').reverse();
  var mutualDn=LINES_TG[[bottomUp[3],bottomUp[2],bottomUp[1]].join('')];
  var mutualUp=LINES_TG[[bottomUp[4],bottomUp[3],bottomUp[2]].join('')];
  var mutualFound=YIJING.find(function(g){return g.upper===mutualUp&&g.lower===mutualDn;});
  var mutualName=mutualFound?mutualFound.name:(mutualUp+'为'+mutualDn);
  var bodyName=mv<=3?upName:dnName,useName=mv<=3?dnName:upName;
  return {
    orig:{name:gName,yao:yao,up:upName,dn:dnName,upImage:TG_IMAGE[up-1],dnImage:TG_IMAGE[dn-1],upWX:TG_WX[up-1],dnWX:TG_WX[dn-1]},
    mutual:{name:mutualName,up:mutualUp,dn:mutualDn},
    change:{name:chgName,yao:chgBin.split('').map(Number),up:chgUp,dn:chgDn},
    body:{name:bodyName,wx:TG_WX[TG.indexOf(bodyName)]},use:{name:useName,wx:TG_WX[TG.indexOf(useName)]},
    moving:mv,line:mv
  };
}

function tiYongRelation(g){
  var t=g.body.wx,u=g.use.wx,sheng={木:'火',火:'土',土:'金',金:'水',水:'木'},ke={木:'土',土:'水',水:'火',火:'金',金:'木'};
  if(t===u)return'体用比和';
  if(sheng[u]===t)return'用生体';
  if(sheng[t]===u)return'体生用';
  if(ke[t]===u)return'体克用';
  return'用克体';
}

function randomGua(){
  document.getElementById('n1').value=Math.floor(Math.random()*99)+1;
  document.getElementById('n2').value=Math.floor(Math.random()*99)+1;
  document.getElementById('n3').value=Math.floor(Math.random()*99)+1;
  doGua();
}

function showGuaReveal(gName,yao,cb){
  var o=document.createElement('div'); o.className='gua-reveal';
  var h=''; for(var i=0;i<6;i++){ h+='<div class="reveal-yao" style="color:'+(yao[i]?'var(--gold-l)':'var(--tx2)')+'">'+(yao[i]?'━━━━━':'━   ━')+'</div>'; }
  o.innerHTML=h+'<div class="reveal-name">'+gName+'</div><div class="reveal-sub">卦 象 已 显</div>';
  document.body.appendChild(o);
  setTimeout(function(){ o.classList.add('fadeOut'); setTimeout(function(){ o.remove(); if(cb)cb(); },800); },4000);
}

function doGua(){
  var n1=parseInt(document.getElementById('n1').value)||1;
  var n2=parseInt(document.getElementById('n2').value)||2;
  var n3=parseInt(document.getElementById('n3').value)||3;
  var question=document.getElementById('question').value.trim();
  var g=getGua(n1,n2,n3);
  var res=document.getElementById('result');
  var origDB=findGua(g.orig.name);
  var chgDB=findGua(g.change.name);
  var anchor='';
  if(origDB){
    anchor+='本卦《'+origDB.name+'》：卦辞曰"'+origDB.judgment+'"；'+origDB.meaning;
    if(origDB.lines&&origDB.lines[g.line-1]) anchor+=' 动爻爻辞："'+origDB.lines[g.line-1]+'"';
  }
  if(chgDB) anchor+=' 变卦《'+chgDB.name+'》：'+chgDB.meaning;
  res._g=g; res._anchor=anchor; res._origDB=origDB;
  showGuaReveal(g.orig.name,g.orig.yao,function(){
  res.innerHTML=
    '<div class="card"><div class="hexagram"><div class="gua-name">'+g.orig.name+'</div><div class="gua-yao">'+yaoStr(g.orig.yao)+'</div><div class="gua-desc">上'+g.orig.up+'（'+g.orig.upImage+'／'+g.orig.upWX+'）下'+g.orig.dn+'（'+g.orig.dnImage+'／'+g.orig.dnWX+'）</div><div class="gua-desc">体卦 '+g.body.name+'（'+g.body.wx+'） · 用卦 '+g.use.name+'（'+g.use.wx+'） · '+tiYongRelation(g)+'<br>互卦「'+g.mutual.name+'」</div><div class="arrow">↓ 第'+g.line+'爻动 ↓</div><div class="gua-name" style="font-size:20px">'+g.change.name+'</div><div class="gua-yao">'+yaoStr(g.change.yao)+'</div></div>'+
    (origDB?'<div class="gua-desc" style="margin-top:8px;font-size:12px;line-height:1.8">【卦辞】'+origDB.judgment+'<br>【解读】'+origDB.meaning+'</div>':'')+
    '<button class="btn-submit" onclick="window.unlockReading()" style="margin-top:16px">积分解锁 AI 解读</button>'+
    '<p style="text-align:center;font-size:11px;color:var(--tx3);margin-top:8px">排卦免费 · AI解读消耗1次积分</p></div>';
  });
}

window.unlockReading=function(){
  var res=document.getElementById('result');
  var g=res._g, anchor=res._anchor, origDB=res._origDB;
  var question=document.getElementById('question').value.trim();
  if(typeof Auth==='undefined'||!Auth.isLoggedIn()){ if(typeof Auth!=='undefined')Auth.showModal('login'); else alert('请先登录'); return; }
  res.innerHTML='<div class="loading"><div class="spinner"></div><p>正在AI解读...</p></div>';
  var qStr=question?'用户问："'+question+'"。':'';
  var prompt='【梅花易数排盘事实】'+qStr+'上卦'+g.orig.up+'（'+g.orig.upWX+'）下卦'+g.orig.dn+'（'+g.orig.dnWX+'），本卦「'+g.orig.name+'」，第'+g.line+'爻动，互卦「'+g.mutual.name+'」，变卦「'+g.change.name+'」。体卦为'+g.body.name+'（'+g.body.wx+'），用卦为'+g.use.name+'（'+g.use.wx+'），体用关系为「'+tiYongRelation(g)+'」。\n\n经典原文：'+anchor+'\n\n请严格按上述事实解读，不得自行改卦。';
  var token=null,code='';try{token=localStorage.getItem('ai_auth_token');code=localStorage.getItem('ai_auth_code')||'';}catch(e){}
  fetch('/api/divination',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(token||'')},body:JSON.stringify({prompt:prompt,code:code,divType:'meihua'})})
  .then(function(r){return r.json();}).then(function(d){
    if(d.error){res.innerHTML='<div class="card"><div class="hexagram"><div class="gua-name">'+g.orig.name+'</div><div class="gua-yao">'+yaoStr(g.orig.yao)+'</div><div class="arrow">↓ 第'+g.line+'爻动 ↓</div><div class="gua-name" style="font-size:20px">'+g.change.name+'</div></div><div class="result" style="text-align:center;color:#e07050;margin-top:12px">'+d.error+'</div></div>';return;}
    var r=d.reading||'';
    var html='<div class="card"><div class="hexagram"><div class="gua-name">'+g.orig.name+'</div><div class="gua-yao">'+yaoStr(g.orig.yao)+'</div><div class="gua-desc">上'+g.orig.up+'（'+g.orig.upElem+'）下'+g.orig.dn+'（'+g.orig.dnElem+'）</div><div class="arrow">↓ 第'+g.line+'爻动 ↓</div><div class="gua-name" style="font-size:20px">'+g.change.name+'</div><div class="gua-yao">'+yaoStr(g.change.yao)+'</div></div>'+
    (origDB?'<div class="gua-desc" style="margin-top:8px;font-size:12px;line-height:1.8">【卦辞】'+origDB.judgment+'</div>':'');
    if(r){ html+='<div class="result" style="margin-top:16px;font-size:14px;line-height:2.2;color:var(--tx)">'+r.replace(/\n/g,'<br>')+'</div>'; }
    html+='<div style="text-align:center;margin-top:12px;font-size:10px;color:var(--tx3)">'+(d.freeUsed?'本次消耗免费次数':'消耗1次积分')+'</div>';
    html+='</div>'; res.innerHTML=html;
  }).catch(function(){res.innerHTML='<div class="card"><div class="hexagram"><div class="gua-name">'+g.orig.name+'</div><div class="gua-yao">'+yaoStr(g.orig.yao)+'</div><div class="arrow">↓ 第'+g.line+'爻动 ↓</div><div class="gua-name" style="font-size:20px">'+g.change.name+'</div></div><div class="result" style="text-align:center;color:var(--tx3)">解读暂不可用，请稍后重试</div></div>';});
};

window.doGua=doGua;
window.randomGua=randomGua;
</script>
</body>
