<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>知时 · 后台管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#ccc;min-height:100vh}
.header{background:#1a1a1a;border-bottom:1px solid #333;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px;color:#e8cf70;letter-spacing:4px}
.header .time{font-size:12px;color:#666}
.container{max-width:1200px;margin:0 auto;padding:24px}
/* 登录遮罩 */
.login-overlay{position:fixed;inset:0;background:#111;z-index:999;display:flex;align-items:center;justify-content:center}
.login-box{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:32px;text-align:center;width:320px}
.login-box h2{color:#e8cf70;margin-bottom:20px;letter-spacing:4px}
.login-box input{width:100%;padding:10px;margin-bottom:12px;background:#222;border:1px solid #444;border-radius:6px;color:#fff;font-size:14px;text-align:center;letter-spacing:2px;outline:none}
.login-box button{width:100%;padding:10px;background:linear-gradient(135deg,#c9a84c,#e8d070);color:#111;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:2px}
.login-box .error{color:#e05050;font-size:12px;margin-top:8px;min-height:18px}
/* 统计卡片 */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:20px;transition:all .2s}
.stat-card:hover{border-color:#c9a84c}
.stat-card .label{font-size:11px;color:#888;letter-spacing:2px;margin-bottom:8px}
.stat-card .value{font-size:32px;font-weight:900;color:#e8cf70}
.stat-card .sub{font-size:11px;color:#555;margin-top:6px}
/* 图表 */
.section{margin-bottom:32px}
.section h2{font-size:14px;color:#888;letter-spacing:2px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #222}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:#888;font-weight:600;border-bottom:1px solid #222;font-size:11px;letter-spacing:1px;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #1a1a1a;white-space:nowrap}
tr:hover td{background:rgba(201,168,76,.03)}
.code{font-family:monospace;letter-spacing:1px}
/* 图表条 */
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:4px 0}
.bar{flex:1;background:rgba(201,168,76,.2);border-radius:3px 3px 0 0;position:relative;min-width:30px;transition:all .2s}
.bar:hover{background:rgba(201,168,76,.5)}
.bar .bar-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:9px;color:#666;white-space:nowrap}
.bar .bar-val{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:#e8cf70}
/* 刷新按钮 */
.refresh-btn{position:fixed;bottom:24px;right:24px;width:48px;height:48px;border-radius:50%;background:#1a1a1a;border:1px solid #333;color:#e8cf70;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.refresh-btn:hover{background:#222;border-color:#c9a84c}
.refresh-btn.spin{animation:spin 1s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:60px;color:#555}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>知时 · 后台</h2>
    <input type="password" id="adminKey" placeholder="管理员密钥" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">进入后台</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<div class="header" id="header" style="display:none">
  <h1>知时 · 后台管理</h1>
  <div class="time" id="clock"></div>
</div>

<div class="container" id="dashboard" style="display:none">
  <div class="stats-grid" id="statsGrid">
    <div class="loading">加载中...</div>
  </div>
  <div class="section">
    <h2>近7天注册趋势</h2>
    <div class="bar-chart" id="signupChart"></div>
  </div>
  <div class="section">
    <h2>最近注册用户</h2>
    <div class="table-wrap"><table id="usersTable"></table></div>
  </div>
  <div class="section">
    <h2>最近积分购买</h2>
    <div class="table-wrap"><table id="creditsTable"></table></div>
  </div>
  <div class="section">
    <h2>页面浏览 TOP</h2>
    <div class="table-wrap"><table id="pvTable"></table></div>
  </div>
</div>

<button class="refresh-btn" id="refreshBtn" onclick="loadData()" style="display:none" title="刷新数据">↻</button>

<script>
var ADMIN_KEY = '';
function login() {
  var key = document.getElementById('adminKey').value.trim();
  if (!key) return;
  ADMIN_KEY = key;
  loadData();
}
function loadData() {
  if (!ADMIN_KEY) return;
  var btn = document.getElementById('refreshBtn');
  btn.classList.add('spin');
  setTimeout(function() { btn.classList.remove('spin'); }, 1000);

  fetch('/api/admin/stats?key=' + encodeURIComponent(ADMIN_KEY))
    .then(function(r) {
      if (r.status === 403) { document.getElementById('loginError').textContent = '密钥错误'; throw new Error('auth'); }
      return r.json();
    })
    .then(function(d) {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('header').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('refreshBtn').style.display = 'flex';
      renderStats(d);
      renderChart(d.daily_signups || []);
      renderUsers(d.recent_users || []);
      renderCredits(d.credit_history || []);
      renderPV(d.page_views || []);
      updateClock();
    })
    .catch(function(e) { if (e.message !== 'auth') document.getElementById('loginError').textContent = '加载失败'; });
}
function renderStats(d) {
  document.getElementById('statsGrid').innerHTML =
    '<div class="stat-card"><div class="label">总注册用户</div><div class="value">'+d.total_users+'</div><div class="sub">今日新增 '+d.today_new_users+'</div></div>' +
    '<div class="stat-card"><div class="label">有效月会员</div><div class="value">'+d.monthly_active+'</div><div class="sub">当前有效订阅</div></div>' +
    '<div class="stat-card"><div class="label">总AI提问</div><div class="value">'+d.total_chats+'</div><div class="sub">历史累计</div></div>' +
    '<div class="stat-card"><div class="label">积分已售</div><div class="value">'+d.total_credits_sold+'</div><div class="sub">已使用 '+d.total_credits_used+'</div></div>' +
    '<div class="stat-card"><div class="label">今日浏览</div><div class="value">'+d.today_page_views+'</div><div class="sub">累计 '+d.total_page_views+'</div></div>';
}
function renderChart(data) {
  if (!data.length) return;
  var max = Math.max.apply(null, data.map(function(d) { return d.count; })) || 1;
  var html = '';
  data.forEach(function(d) {
    var h = Math.max(4, Math.round(d.count / max * 100));
    html += '<div class="bar" style="height:'+h+'px"><div class="bar-val">'+d.count+'</div><div class="bar-label">'+(d.date||'').slice(5)+'</div></div>';
  });
  document.getElementById('signupChart').innerHTML = html;
}
function renderUsers(users) {
  var html = '<tr><th>ID</th><th>邮箱</th><th>手机</th><th>注册时间</th></tr>';
  users.forEach(function(u) {
    html += '<tr><td>'+u.id+'</td><td>'+(u.email||'-')+'</td><td>'+(u.phone||'-')+'</td><td>'+(u.created_at||'').slice(0,16)+'</td></tr>';
  });
  document.getElementById('usersTable').innerHTML = html;
}
function renderCredits(data) {
  var html = '<tr><th>兑换码</th><th>次数</th><th>渠道</th><th>创建时间</th></tr>';
  data.forEach(function(c) {
    html += '<tr><td class="code">'+c.code+'</td><td>'+c.credits+'</td><td>'+(c.channel||'-')+'</td><td>'+(c.created_at||'').slice(0,16)+'</td></tr>';
  });
  document.getElementById('creditsTable').innerHTML = html;
}
function renderPV(data) {
  var html = '<tr><th>日期</th><th>页面</th><th>浏览量</th></tr>';
  var sorted = data.slice().sort(function(a,b) { return b.count - a.count; }).slice(0, 20);
  sorted.forEach(function(p) {
    html += '<tr><td>'+p.date+'</td><td>'+p.path+'</td><td>'+p.count+'</td></tr>';
  });
  document.getElementById('pvTable').innerHTML = html;
}
function updateClock() {
  var now = new Date();
  document.getElementById('clock').textContent = now.toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'});
  setTimeout(updateClock, 10000);
}
// 自动刷新每 60 秒
setInterval(loadData, 60000);
</script>
</body>
</html>
