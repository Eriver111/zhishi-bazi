<body>
<div id="zhishi-nav" class="top-nav archive-top-nav">
  <a class="archive-top-nav__brand" href="/">知时</a>

  <span id="nav-user-area" class="nav-user"></span>
</div>

<main class="archive-page">
  <header class="archive-hero">
    <p>命盘管理</p>
    <h1>命盘档案库</h1>

  </header>

  <section class="archive-tools" aria-label="筛选命盘档案">
    <label class="archive-search"><span aria-hidden="true">⌕</span><input id="archiveSearch" type="search" placeholder="搜索姓名、日期或四柱" autocomplete="off"></label>
    <div class="archive-filters" role="group" aria-label="档案类型筛选">
      <button type="button" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" data-filter="personal" aria-pressed="false">个人</button>
      <button type="button" data-filter="hepan" aria-pressed="false">合盘</button>
      <button type="button" data-filter="male" aria-pressed="false">乾造</button>
      <button type="button" data-filter="female" aria-pressed="false">坤造</button>
    </div>
  </section>

  <div id="archiveContent" class="archive-content" aria-live="polite">
    <div class="archive-loading">正在整理档案…</div>
  </div>
</main>
